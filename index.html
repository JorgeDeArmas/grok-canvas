<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Canvas</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7;
    --card: #fff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --line: rgba(60,60,67,.16);
    --accent: #007aff;
    --good: #34c759;
    --bad: #ff3b30;
    --warn: #ff9500;
    --chip: #e5e5ea;
    --shadow: 0 1px 2px rgba(0,0,0,.04);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --line: rgba(255,255,255,.12);
      --accent: #0a84ff;
      --chip: #2c2c2e;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 2;
    padding: calc(12px + var(--safe-t)) 16px 12px;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(180%) blur(16px);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 22px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.02em; }
  .meta { color: var(--muted); font-size: 13px; }
  .chip {
    display: inline-block; margin-top: 8px; padding: 4px 10px;
    background: var(--chip); border-radius: 999px; font-size: 13px;
  }
  main {
    padding: 12px 16px calc(24px + var(--safe-b));
    display: flex; flex-direction: column; gap: 12px;
    max-width: 720px; margin: 0 auto;
  }
  .summary { color: var(--muted); margin: 0; font-size: 15px; }
  article {
    background: var(--card); border-radius: 16px; padding: 14px 14px 16px;
    box-shadow: var(--shadow);
  }
  article h2 { font-size: 15px; margin: 0 0 10px; letter-spacing: -.01em; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { background: var(--bg); border-radius: 12px; padding: 12px; min-height: 72px; }
  .kpi b { display: block; font-size: 22px; letter-spacing: -.03em; }
  .kpi span { color: var(--muted); font-size: 13px; }
  .up { color: var(--good); } .down { color: var(--bad); }
  svg.chart { width: 100%; height: 220px; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .sw { width: 8px; height: 8px; border-radius: 99px; display: inline-block; margin-right: 4px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
  table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  ul.clean { list-style: none; margin: 0; padding: 0; }
  li.row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  li.row:last-child { border-bottom: 0; }
  button.check {
    width: 28px; height: 28px; min-width: 44px; min-height: 44px;
    border-radius: 8px; border: 1.5px solid var(--line); background: transparent;
    color: var(--accent); font-size: 16px;
  }
  button.check.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .when { color: var(--muted); font-size: 12px; min-width: 72px; }
  .cards { display: flex; flex-direction: column; gap: 8px; }
  .card {
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-decoration: none; color: inherit;
  }
  .card strong { display: block; }
  .card p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .callout { border-left: 3px solid var(--accent); padding-left: 10px; }
  .callout.warn { border-color: var(--warn); }
  .callout.bad { border-color: var(--bad); }
  .callout.good { border-color: var(--good); }
  details { border-bottom: 1px solid var(--line); padding: 8px 0; }
  summary { min-height: 44px; display: flex; align-items: center; font-weight: 600; }
  .prose { font-size: 15px; }
  .status { color: var(--muted); font-size: 14px; padding: 24px 0; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cols h3 { margin: 0 0 6px; font-size: 13px; }
  .cols ul { margin: 0; padding-left: 18px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Canvas</h1>
  <div class="meta" id="meta">Cargando…</div>
  <div class="chip" id="change" hidden></div>
</header>
<main id="main"></main>
<script>
const COLORS = ["#007aff","#34c759","#ff9500","#ff2d55","#5e5ce6","#64d2ff","#ac8e68","#30b0c7"];
const $ = (id) => document.getElementById(id);

function canvasId() {
  const q = new URLSearchParams(location.search).get("c");
  if (q) return q;
  const h = location.hash.replace(/^#/, "");
  return h || "demo";
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function money(n) {
  if (typeof n === "number") return n.toLocaleString("es-ES");
  return esc(n);
}

function barChart(series) {
  const vals = series.map((d) => Number(d.value) || 0);
  const max = Math.max(...vals, 1);
  const w = 320, h = 200, pad = 24;
  const bw = (w - pad * 2) / series.length;
  const bars = series.map((d, i) => {
    const bh = ((Number(d.value) || 0) / max) * (h - 40);
    const x = pad + i * bw + bw * 0.15;
    const y = h - 20 - bh;
    return `<rect x="${x}" y="${y}" width="${bw * 0.7}" height="${bh}" rx="4" fill="${COLORS[i % COLORS.length]}"></rect>
      <text x="${x + bw * 0.35}" y="${h - 6}" text-anchor="middle" font-size="10" fill="currentColor">${esc(d.label).slice(0, 8)}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${bars}</svg>`;
}

function lineChart(points) {
  const vals = points.map((d) => Number(d.value) || 0);
  const max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const w = 320, h = 200, pad = 16;
  const span = max - min || 1;
  const coords = points.map((d, i) => {
    const x = pad + (i * (w - pad * 2)) / Math.max(points.length - 1, 1);
    const y = pad + (1 - ((Number(d.value) || 0) - min) / span) * (h - pad * 2 - 16);
    return [x, y];
  });
  const d = coords.map((p, i) => `${i ? "L" : "M"}${p[0]},${p[1]}`).join(" ");
  const dots = coords.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#007aff"></circle>`).join("");
  const labels = points.map((pt, i) => `<text x="${coords[i][0]}" y="${h - 2}" text-anchor="middle" font-size="10" fill="currentColor">${esc(pt.label).slice(0, 6)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img"><path d="${d}" fill="none" stroke="#007aff" stroke-width="2.5"></path>${dots}${labels}</svg>`;
}

function donut(parts) {
  const total = parts.reduce((s, p) => s + (Number(p.value) || 0), 0) || 1;
  let angle = -Math.PI / 2;
  const r = 70, cx = 100, cy = 90;
  const slices = parts.map((p, i) => {
    const a = ((Number(p.value) || 0) / total) * Math.PI * 2;
    const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
    angle += a;
    const x2 = cx + r * Math.cos(angle), y2 = cy + r * Math.sin(angle);
    const large = a > Math.PI ? 1 : 0;
    return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${COLORS[i % COLORS.length]}"></path>`;
  }).join("");
  const legend = parts.map((p, i) => `<span><i class="sw" style="background:${COLORS[i % COLORS.length]}"></i>${esc(p.label)} ${Math.round(((Number(p.value)||0)/total)*100)}%</span>`).join("");
  return `<svg class="chart" viewBox="0 0 200 180" role="img">${slices}<circle cx="${cx}" cy="${cy}" r="40" fill="var(--card)"></circle></svg><div class="legend">${legend}</div>`;
}

function block(b) {
  const t = b.type;
  const title = b.title ? `<h2>${esc(b.title)}</h2>` : "";
  const d = b.data || {};
  if (t === "kpi") {
    const items = (d.items || []).map((it) => {
      const delta = it.delta ? `<span class="${String(it.delta).startsWith("-") ? "down" : "up"}">${esc(it.delta)}</span>` : "";
      return `<div class="kpi"><b>${money(it.value)}</b><span>${esc(it.label)} ${delta}</span></div>`;
    }).join("");
    return `<article>${title}<div class="kpis">${items}</div></article>`;
  }
  if (t === "bar") return `<article>${title}${barChart(d.series || [])}</article>`;
  if (t === "line") return `<article>${title}${lineChart(d.points || [])}</article>`;
  if (t === "donut") return `<article>${title}${donut(d.parts || [])}</article>`;
  if (t === "table") {
    const cols = d.columns || [];
    const head = cols.map((c) => `<th>${esc(c)}</th>`).join("");
    const rows = (d.rows || []).map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("");
    return `<article>${title}<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div></article>`;
  }
  if (t === "cards") {
    const cards = (d.items || []).map((it) => {
      const inner = `<strong>${esc(it.title)}</strong><p>${esc(it.body || "")}</p>`;
      return it.href ? `<a class="card" href="${esc(it.href)}">${inner}</a>` : `<div class="card">${inner}</div>`;
    }).join("");
    return `<article>${title}<div class="cards">${cards}</div></article>`;
  }
  if (t === "timeline") {
    const items = (d.items || []).map((it) => `<li class="row"><span class="when">${esc(it.when)}</span><div><strong>${esc(it.title)}</strong><div class="meta">${esc(it.body || "")}</div></div></li>`).join("");
    return `<article>${title}<ul class="clean">${items}</ul></article>`;
  }
  if (t === "checklist") {
    const items = (d.items || []).map((it, i) => {
      const on = it.done ? "on" : "";
      return `<li class="row"><button class="check ${on}" type="button" aria-pressed="${it.done ? "true" : "false"}" data-i="${i}">${it.done ? "✓" : ""}</button><div>${esc(it.label)}</div></li>`;
    }).join("");
    return `<article data-check>${title}<ul class="clean">${items}</ul></article>`;
  }
  if (t === "callout") {
    return `<article><div class="callout ${esc(d.tone || "")}">${title}<p class="prose">${esc(d.text || "")}</p></div></article>`;
  }
  if (t === "steps") {
    const items = (d.items || []).map((it, i) => `<li class="row"><span class="when">${i + 1}</span><div><strong>${esc(it.title)}</strong><div class="meta">${esc(it.body || "")}</div></div></li>`).join("");
    return `<article>${title}<ul class="clean">${items}</ul></article>`;
  }
  if (t === "compare") {
    const col = (name, arr) => `<div><h3>${esc(name)}</h3><ul>${(arr || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
    return `<article>${title}<div class="cols">${col(d.leftLabel || "A favor", d.left)}${col(d.rightLabel || "En contra", d.right)}</div></article>`;
  }
  if (t === "faq") {
    const items = (d.items || []).map((it) => `<details><summary>${esc(it.q)}</summary><p class="prose">${esc(it.a)}</p></details>`).join("");
    return `<article>${title}${items}</article>`;
  }
  if (t === "places" || t === "gallery") {
    const items = (d.items || []).map((it) => `<div class="card"><strong>${esc(it.title)}</strong><p>${esc(it.body || it.meta || "")}</p></div>`).join("");
    return `<article>${title}<div class="cards">${items}</div></article>`;
  }
  if (t === "prose") return `<article>${title}<p class="prose">${esc(d.text || "")}</p></article>`;
  return `<article>${title}<p class="prose">${esc(JSON.stringify(d))}</p></article>`;
}

function render(scene) {
  document.title = scene.title || "Canvas";
  $("title").textContent = scene.title || "Canvas";
  const when = scene.updatedAt ? new Date(scene.updatedAt) : null;
  const stamp = when && !Number.isNaN(when.getTime())
    ? when.toLocaleString("es", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })
    : "";
  $("meta").textContent = stamp ? `Actualizado ${stamp}` : "Canvas";
  const change = $("change");
  if (scene.change) { change.hidden = false; change.textContent = scene.change; }
  else change.hidden = true;
  const main = $("main");
  main.innerHTML = "";
  if (scene.summary) {
    const p = document.createElement("p");
    p.className = "summary";
    p.textContent = scene.summary;
    main.appendChild(p);
  }
  main.insertAdjacentHTML("beforeend", (scene.blocks || []).map(block).join(""));
  main.querySelectorAll("button.check").forEach((btn) => {
    btn.addEventListener("click", () => {
      const on = btn.classList.toggle("on");
      btn.textContent = on ? "✓" : "";
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    });
  });
}

async function load() {
  const id = canvasId().replace(/[^a-zA-Z0-9_-]/g, "");
  const onPages = location.hostname.endsWith("github.io");
  const url = onPages
    ? `scenes/${id}.json?t=${Date.now()}`
    : `https://cdn.jsdelivr.net/gh/JorgeDeArmas/grok-canvas@main/scenes/${id}.json?t=${Date.now()}`;
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(String(res.status));
    render(await res.json());
  } catch (err) {
    $("meta").textContent = "No se pudo cargar esta escena";
    $("main").innerHTML = `<p class="status">No encuentro <b>${esc(id)}</b>. Pídele a Grok que lo publique de nuevo.</p>`;
  }
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
