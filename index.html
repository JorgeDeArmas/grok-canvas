<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' blob: https://cdn.jsdelivr.net https://raw.githubusercontent.com https://raw.githack.com https://rawcdn.githack.com; media-src 'self' blob: https://cdn.jsdelivr.net https://raw.githubusercontent.com https://raw.githack.com https://rawcdn.githack.com; connect-src 'self' https://cdn.jsdelivr.net https://raw.githubusercontent.com https://raw.githack.com https://rawcdn.githack.com https://webhook.site; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">
<meta name="theme-color" content="#f2f2f7">
<title>Canvas</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7;
    --card: #fff;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --line: rgba(60,60,67,.16);
    --accent: #007aff;
    --good: #34c759;
    --bad: #ff3b30;
    --warn: #ff9500;
    --chip: #e5e5ea;
    --shadow: 0 1px 2px rgba(0,0,0,.04);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000;
      --card: #1c1c1e;
      --text: #f5f5f7;
      --muted: #98989d;
      --line: rgba(255,255,255,.12);
      --accent: #0a84ff;
      --chip: #2c2c2e;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; z-index: 2;
    padding: calc(12px + var(--safe-t)) 16px 12px;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(180%) blur(16px);
    -webkit-backdrop-filter: saturate(180%) blur(16px);
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 22px; line-height: 1.2; margin: 0 0 4px; letter-spacing: -.02em; }
  .meta { color: var(--muted); font-size: 13px; }
  .chip {
    display: inline-block; margin-top: 8px; padding: 4px 10px;
    background: var(--chip); border-radius: 999px; font-size: 13px;
  }
  main {
    padding: 12px 16px calc(24px + var(--safe-b));
    display: flex; flex-direction: column; gap: 12px;
    max-width: 720px; margin: 0 auto;
  }
  .summary { color: var(--muted); margin: 0; font-size: 15px; }
  article {
    background: var(--card); border-radius: 16px; padding: 14px 14px 16px;
    box-shadow: var(--shadow);
  }
  article h2 { font-size: 15px; margin: 0 0 10px; letter-spacing: -.01em; }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { background: var(--bg); border-radius: 12px; padding: 12px; min-height: 72px; }
  .kpi b { display: block; font-size: 22px; letter-spacing: -.03em; }
  .kpi span { color: var(--muted); font-size: 13px; }
  .up { color: var(--good); } .down { color: var(--bad); }
  svg.chart { width: 100%; height: 220px; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .sw { width: 8px; height: 8px; border-radius: 99px; display: inline-block; margin-right: 4px; }
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; }
  table { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  ul.clean { list-style: none; margin: 0; padding: 0; }
  li.row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  li.row:last-child { border-bottom: 0; }
  button.check {
    width: 28px; height: 28px; min-width: 44px; min-height: 44px;
    border-radius: 8px; border: 1.5px solid var(--line); background: transparent;
    color: var(--accent); font-size: 16px;
  }
  button.check.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .when { color: var(--muted); font-size: 12px; min-width: 72px; }
  .cards { display: flex; flex-direction: column; gap: 8px; }
  .card {
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-decoration: none; color: inherit;
  }
  .card strong { display: block; }
  .card p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .callout { border-left: 3px solid var(--accent); padding-left: 10px; }
  .callout.warn { border-color: var(--warn); }
  .callout.bad { border-color: var(--bad); }
  .callout.good { border-color: var(--good); }
  details { border-bottom: 1px solid var(--line); padding: 8px 0; }
  summary { min-height: 44px; display: flex; align-items: center; font-weight: 600; }
  .prose { font-size: 15px; }
  .status { color: var(--muted); font-size: 14px; padding: 24px 0; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .hint.bad { color: var(--bad); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cols h3 { margin: 0 0 6px; font-size: 13px; }
  .cols ul { margin: 0; padding-left: 18px; font-size: 14px; }
  textarea.script {
    width: 100%; min-height: 160px; resize: vertical; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font: 16px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 12px;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button.act, a.act {
    min-height: 44px; padding: 0 14px; border-radius: 12px; border: 0;
    background: var(--accent); color: #fff; font: 600 15px/44px -apple-system, sans-serif;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  button.ghost, a.ghost { background: var(--chip); color: var(--text); }
  video, img.still, audio { width: 100%; border-radius: 12px; background: #000; display: block; }
  img.still { height: auto; background: var(--bg); }
  .pipe { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .step { min-width: 72px; text-align: center; font-size: 12px; color: var(--muted); }
  .dot { width: 14px; height: 14px; border-radius: 99px; margin: 0 auto 4px; background: var(--chip); }
  .step.done .dot { background: var(--good); }
  .step.now .dot { background: var(--warn); }
  .toast { font-size: 13px; color: var(--muted); min-height: 18px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1 id="title">Canvas</h1>
  <div class="meta" id="meta">Cargando…</div>
  <div class="chip" id="change" hidden></div>
</header>
<main id="main"></main>
<script>
const COLORS = ["#007aff","#34c759","#ff9500","#ff2d55","#5e5ce6","#64d2ff","#ac8e68","#30b0c7"];
const $ = (id) => document.getElementById(id);

function canvasId() {
  const q = new URLSearchParams(location.search).get("c");
  if (q) return q;
  const h = location.hash.replace(/^#/, "");
  return h || "demo";
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

const MEDIA_HOSTS = new Set([
  "cdn.jsdelivr.net",
  "raw.githubusercontent.com",
  "raw.githack.com",
  "rawcdn.githack.com"
]);
const PIPE_STATES = new Set(["done", "now", "wait"]);
const CALLOUT_TONES = new Set(["info", "warn", "good", "bad"]);
const SAFE_MIME = new Set([
  "image/jpeg", "image/png", "image/gif", "image/webp",
  "video/mp4", "video/webm", "video/quicktime",
  "audio/mpeg", "audio/mp4", "audio/wav", "audio/wave", "audio/x-wav",
  "audio/ogg", "audio/webm", "audio/aac"
]);
const FEEDBACK_UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const FEEDBACK_TEXT_MAX = 50000;

function allowToken(raw, allowed) {
  const value = String(raw ?? "").trim();
  return allowed.has(value) ? value : "";
}

function parseHttpUrl(raw) {
  const text = String(raw ?? "").trim();
  if (!text || text.length > 4096) return null;
  if (/[\u0000-\u001F\u007F\u2028\u2029\\]/.test(text)) return null;
  if (text.startsWith("//")) return null;
  let url;
  try {
    url = new URL(text, location.href);
  } catch (err) {
    return null;
  }
  if (url.username || url.password) return null;
  return { text, url };
}

function isRelativePath(text) {
  return !/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(text);
}

function safeHttpsUrl(raw) {
  const parsed = parseHttpUrl(raw);
  if (!parsed) return "";
  const { text, url } = parsed;
  if (isRelativePath(text)) {
    if (url.origin !== location.origin) return "";
    if (url.protocol !== "http:" && url.protocol !== "https:") return "";
    return url.href;
  }
  if (url.protocol !== "https:") return "";
  return url.href;
}

function safeMediaUrl(raw) {
  const parsed = parseHttpUrl(raw);
  if (!parsed) return "";
  const { url } = parsed;
  if (url.protocol !== "https:") return "";
  if (url.port) return "";
  const host = url.hostname.toLowerCase().replace(/\.$/, "");
  if (!MEDIA_HOSTS.has(host)) return "";
  return url.href;
}

function safeMime(raw, fallback) {
  let mime = String(raw ?? "").trim().toLowerCase().split(";")[0].trim();
  if (mime === "audio/mp3") mime = "audio/mpeg";
  if (SAFE_MIME.has(mime)) return mime;
  if (fallback && SAFE_MIME.has(fallback)) return fallback;
  return "application/octet-stream";
}

function deniedHint() {
  return `<p class="hint">Enlace no permitido.</p>`;
}

function money(n) {
  if (typeof n === "number") return n.toLocaleString("es-ES");
  return esc(n);
}

function barChart(series) {
  if (!series.length) return "";
  const vals = series.map((d) => Number(d.value) || 0);
  const max = Math.max(...vals, 1);
  const w = 320, h = 200, pad = 24;
  const bw = (w - pad * 2) / series.length;
  const bars = series.map((d, i) => {
    const bh = ((Number(d.value) || 0) / max) * (h - 40);
    const x = pad + i * bw + bw * 0.15;
    const y = h - 20 - bh;
    return `<rect x="${x}" y="${y}" width="${bw * 0.7}" height="${bh}" rx="4" fill="${COLORS[i % COLORS.length]}"></rect>
      <text x="${x + bw * 0.35}" y="${h - 6}" text-anchor="middle" font-size="10" fill="currentColor">${esc(d.label).slice(0, 8)}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img">${bars}</svg>`;
}

function lineChart(points) {
  if (!points.length) return "";
  const vals = points.map((d) => Number(d.value) || 0);
  const max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const w = 320, h = 200, pad = 16;
  const span = max - min || 1;
  const coords = points.map((d, i) => {
    const x = pad + (i * (w - pad * 2)) / Math.max(points.length - 1, 1);
    const y = pad + (1 - ((Number(d.value) || 0) - min) / span) * (h - pad * 2 - 16);
    return [x, y];
  });
  const d = coords.map((p, i) => `${i ? "L" : "M"}${p[0]},${p[1]}`).join(" ");
  const dots = coords.map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#007aff"></circle>`).join("");
  const labels = points.map((pt, i) => `<text x="${coords[i][0]}" y="${h - 2}" text-anchor="middle" font-size="10" fill="currentColor">${esc(pt.label).slice(0, 6)}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img"><path d="${d}" fill="none" stroke="#007aff" stroke-width="2.5"></path>${dots}${labels}</svg>`;
}

function donut(parts) {
  const total = parts.reduce((s, p) => s + (Number(p.value) || 0), 0) || 1;
  let angle = -Math.PI / 2;
  const r = 70, cx = 100, cy = 90;
  const slices = parts.map((p, i) => {
    const a = ((Number(p.value) || 0) / total) * Math.PI * 2;
    const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
    angle += a;
    const x2 = cx + r * Math.cos(angle), y2 = cy + r * Math.sin(angle);
    const large = a > Math.PI ? 1 : 0;
    return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${COLORS[i % COLORS.length]}"></path>`;
  }).join("");
  const legend = parts.map((p, i) => `<span><i class="sw" style="background:${COLORS[i % COLORS.length]}"></i>${esc(p.label)} ${Math.round(((Number(p.value)||0)/total)*100)}%</span>`).join("");
  return `<svg class="chart" viewBox="0 0 200 180" role="img">${slices}<circle cx="${cx}" cy="${cy}" r="40" fill="var(--card)"></circle></svg><div class="legend">${legend}</div>`;
}

function secret() {
  const h = new URLSearchParams((location.hash || "").replace(/^#/, ""));
  return { b: h.get("b") || "", k: h.get("k") || "", f: h.get("f") || "" };
}

function b64urlToBytes(text) {
  const pad = "=".repeat((4 - (text.length % 4)) % 4);
  const bin = atob(text.replace(/-/g, "+").replace(/_/g, "/") + pad);
  return Uint8Array.from(bin, (c) => c.charCodeAt(0));
}

function b64ToBytes(text) {
  const bin = atob(text);
  return Uint8Array.from(bin, (c) => c.charCodeAt(0));
}

async function decryptScene(blob, keyText) {
  const key = await crypto.subtle.importKey("raw", b64urlToBytes(keyText), "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64ToBytes(blob.iv) },
    key,
    b64ToBytes(blob.ct)
  );
  return JSON.parse(new TextDecoder().decode(plain));
}

const decryptedMedia = new Map();
let renderedScene = "";

function guessImageMime(bytes) {
  if (bytes.length >= 8 && bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47) return "image/png";
  if (bytes.length >= 6 && bytes[0] === 0x47 && bytes[1] === 0x49 && bytes[2] === 0x46) return "image/gif";
  if (bytes.length >= 12 && bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46 && bytes[8] === 0x57 && bytes[9] === 0x45 && bytes[10] === 0x42 && bytes[11] === 0x50) return "image/webp";
  return "image/jpeg";
}

function encErrorText(err) {
  const code = String((err && err.message) || "");
  if (code === "missing") return "Falta el archivo cifrado.";
  if (code === "blocked") return "Enlace no permitido.";
  if (code === "fetch" || code === "http") return "No se pudo descargar el archivo cifrado.";
  return "No se pudo descifrar el archivo.";
}

async function decryptMediaNow(url, mime) {
  const safe = safeMediaUrl(url);
  if (!safe) throw new Error("blocked");
  const keyText = secret().k;
  if (!keyText) throw new Error("decrypt");
  let res;
  try {
    res = await fetch(safe, { referrerPolicy: "no-referrer" });
  } catch (e) {
    throw new Error("fetch");
  }
  if (!res.ok) throw new Error("http");
  const buf = new Uint8Array(await res.arrayBuffer());
  if (buf.byteLength < 28) throw new Error("decrypt");
  const iv = new Uint8Array(buf.subarray(0, 12));
  const ct = new Uint8Array(buf.subarray(12));
  let plain;
  try {
    const key = await crypto.subtle.importKey("raw", b64urlToBytes(keyText), "AES-GCM", false, ["decrypt"]);
    plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
  } catch (e) {
    throw new Error("decrypt");
  }
  const type = safeMime(mime, guessImageMime(new Uint8Array(plain)));
  return URL.createObjectURL(new Blob([plain], { type }));
}

async function decryptMediaFile(url, mime) {
  const hit = decryptedMedia.get(url + "\0" + (mime || ""));
  if (hit) return hit;
  const cacheKey = url + "\0" + (mime || "");
  let task;
  task = (async () => {
    try {
      const objectUrl = await decryptMediaNow(url, mime);
      decryptedMedia.set(cacheKey, objectUrl);
      return objectUrl;
    } catch (err) {
      if (decryptedMedia.get(cacheKey) === task) decryptedMedia.delete(cacheKey);
      throw err;
    }
  })();
  decryptedMedia.set(cacheKey, task);
  return task;
}

async function sendFeedback(item) {
  const box = String(secret().f || "").trim();
  if (!FEEDBACK_UUID.test(box)) throw new Error("sin buzón");
  let endpoint;
  try {
    endpoint = new URL("https://webhook.site/" + box);
  } catch (err) {
    throw new Error("sin buzón");
  }
  if (endpoint.origin !== "https://webhook.site" || endpoint.pathname !== "/" + box) throw new Error("sin buzón");
  if (endpoint.search || endpoint.hash || endpoint.username || endpoint.password) throw new Error("sin buzón");
  const src = item || {};
  const payload = { kind: src.kind };
  if (src.blockId != null) payload.blockId = String(src.blockId).slice(0, 200);
  if (src.choice != null) payload.choice = String(src.choice).slice(0, 32);
  if (src.text != null) payload.text = String(src.text).slice(0, FEEDBACK_TEXT_MAX);
  payload.at = new Date().toISOString();
  const body = JSON.stringify(payload);
  if (body.length > 400000) throw new Error("grande");
  const res = await fetch(endpoint.href, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body,
    redirect: "error",
    referrerPolicy: "no-referrer",
    credentials: "omit"
  });
  if (!res.ok) throw new Error(String(res.status));
}

function mediaActions(src, name) {
  const href = safeMediaUrl(src);
  if (!href) return "";
  return `<div class="actions"><a class="act" href="${esc(href)}" download="${esc(name)}" target="_blank" rel="noopener noreferrer">Descargar</a></div>`;
}

function encMedia(kind, d, alt) {
  const src = safeMediaUrl(d.src || "");
  if (!src) return deniedHint();
  const poster = safeMediaUrl(d.poster || "");
  const name = d.filename || (kind === "video" ? "video.mp4" : kind === "audio" ? "voz.mp3" : "still.jpg");
  return `<div class="enc-media" aria-busy="true" data-src="${esc(src)}" data-mime="${esc(d.mime || "")}" data-name="${esc(name)}" data-kind="${kind}" data-poster="${esc(poster)}" data-poster-enc="${d.posterEnc === true ? "1" : ""}" data-alt="${esc(alt || "")}"><p class="hint" data-enc-status role="status">Descifrando…</p></div><div class="actions"><a class="act" data-enc-dl hidden download="${esc(name)}" target="_blank" rel="noopener noreferrer">Descargar</a></div>`;
}

function showEncError(el, message) {
  if (!el.isConnected) return;
  el.dataset.pending = "";
  el.setAttribute("aria-busy", "false");
  let status = el.querySelector("[data-enc-status]");
  if (!status) {
    status = document.createElement("p");
    status.setAttribute("data-enc-status", "");
    status.setAttribute("role", "status");
    el.prepend(status);
  }
  status.className = "hint bad";
  status.dataset.encError = "1";
  status.textContent = message;
}

function mountEncMedia(el, objectUrl, posterUrl) {
  if (!el.isConnected || el.dataset.ready === "1") return;
  el.dataset.ready = "1";
  el.setAttribute("aria-busy", "false");
  const kind = el.dataset.kind;
  const status = el.querySelector("[data-enc-status]");
  if (status) status.remove();
  let media;
  if (kind === "video") {
    media = document.createElement("video");
    media.controls = true;
    media.playsInline = true;
    media.setAttribute("playsinline", "");
    media.setAttribute("webkit-playsinline", "");
    media.preload = "auto";
    if (posterUrl) media.poster = posterUrl;
  } else if (kind === "audio") {
    media = document.createElement("audio");
    media.controls = true;
    media.preload = "auto";
  } else {
    media = document.createElement("img");
    media.className = "still";
    media.alt = el.dataset.alt || "";
  }
  el.appendChild(media);
  media.src = objectUrl;
  if (kind !== "image") media.load();
  const dl = el.parentElement && el.parentElement.querySelector("[data-enc-dl]");
  if (dl) {
    dl.href = objectUrl;
    if (el.dataset.name) dl.download = el.dataset.name;
    dl.hidden = false;
  }
}

async function hydrateEncMedia(el) {
  if (!el.isConnected || el.dataset.ready === "1" || el.dataset.pending === "1") return;
  const src = safeMediaUrl(el.dataset.src || "");
  if (!el.dataset.src) {
    showEncError(el, encErrorText(new Error("missing")));
    return;
  }
  if (!src) {
    showEncError(el, "Enlace no permitido.");
    return;
  }
  el.dataset.pending = "1";
  const mime = el.dataset.mime || "";
  const poster = safeMediaUrl(el.dataset.poster || "");
  try {
    const mediaPromise = decryptMediaFile(src, mime);
    let posterPromise = Promise.resolve("");
    if (el.dataset.kind === "video" && poster) {
      posterPromise = el.dataset.posterEnc === "1"
        ? decryptMediaFile(poster, "").catch(() => "")
        : Promise.resolve(poster);
    }
    const [objectUrl, posterUrl] = await Promise.all([mediaPromise, posterPromise]);
    mountEncMedia(el, objectUrl, posterUrl);
  } catch (err) {
    showEncError(el, encErrorText(err));
  }
}

function hydrateEncryptedMedia(root) {
  root.querySelectorAll(".enc-media").forEach((el) => { void hydrateEncMedia(el); });
}

function retryFailedMedia(root) {
  root.querySelectorAll(".enc-media").forEach((el) => {
    if (el.dataset.ready === "1" || el.dataset.pending === "1") return;
    const failed = el.querySelector("[data-enc-error]");
    if (!failed) return;
    failed.remove();
    const hint = document.createElement("p");
    hint.className = "hint";
    hint.setAttribute("data-enc-status", "");
    hint.setAttribute("role", "status");
    hint.textContent = "Descifrando…";
    el.appendChild(hint);
    el.setAttribute("aria-busy", "true");
    void hydrateEncMedia(el);
  });
}

function block(b) {
  const t = b.type;
  const title = b.title ? `<h2>${esc(b.title)}</h2>` : "";
  const d = b.data || {};
  if (t === "kpi") {
    const items = (d.items || []).map((it) => {
      const delta = it.delta ? `<span class="${String(it.delta).startsWith("-") ? "down" : "up"}">${esc(it.delta)}</span>` : "";
      return `<div class="kpi"><b>${money(it.value)}</b><span>${esc(it.label)} ${delta}</span></div>`;
    }).join("");
    return `<article>${title}<div class="kpis">${items}</div></article>`;
  }
  if (t === "bar") return `<article>${title}${barChart(d.series || [])}</article>`;
  if (t === "line") return `<article>${title}${lineChart(d.points || [])}</article>`;
  if (t === "donut") return `<article>${title}${donut(d.parts || [])}</article>`;
  if (t === "table") {
    const cols = d.columns || [];
    const head = cols.map((c) => `<th>${esc(c)}</th>`).join("");
    const rows = (d.rows || []).map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("");
    return `<article>${title}<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div></article>`;
  }
  if (t === "cards") {
    const items = d.items == null && (d.title || d.body)
      ? [{ title: d.title, body: d.body, href: d.href }]
      : (d.items || []);
    const cards = items.map((it) => {
      const inner = `<strong>${esc(it.title)}</strong><p>${esc(it.body || "")}</p>`;
      const href = it.href ? safeHttpsUrl(it.href) : "";
      if (it.href && !href) return `<div class="card">${inner}<p class="hint">Enlace no permitido.</p></div>`;
      return href ? `<a class="card" href="${esc(href)}" rel="noopener noreferrer">${inner}</a>` : `<div class="card">${inner}</div>`;
    }).join("");
    return `<article>${title}<div class="cards">${cards}</div></article>`;
  }
  if (t === "timeline") {
    const items = (d.items || []).map((it) => `<li class="row"><span class="when">${esc(it.when)}</span><div><strong>${esc(it.title)}</strong><div class="meta">${esc(it.body || "")}</div></div></li>`).join("");
    return `<article>${title}<ul class="clean">${items}</ul></article>`;
  }
  if (t === "checklist") {
    const items = (d.items || []).map((it, i) => {
      const on = it.done ? "on" : "";
      return `<li class="row"><button class="check ${on}" type="button" aria-pressed="${it.done ? "true" : "false"}" data-i="${i}">${it.done ? "✓" : ""}</button><div>${esc(it.label)}</div></li>`;
    }).join("");
    return `<article data-check>${title}<ul class="clean">${items}</ul></article>`;
  }
  if (t === "callout") {
    const tone = allowToken(d.tone, CALLOUT_TONES);
    return `<article><div class="callout${tone ? " " + tone : ""}">${title}<p class="prose">${esc(d.text || "")}</p></div></article>`;
  }
  if (t === "steps") {
    const items = (d.items || []).map((it, i) => `<li class="row"><span class="when">${i + 1}</span><div><strong>${esc(it.title)}</strong><div class="meta">${esc(it.body || "")}</div></div></li>`).join("");
    return `<article>${title}<ul class="clean">${items}</ul></article>`;
  }
  if (t === "compare") {
    const col = (name, arr) => `<div><h3>${esc(name)}</h3><ul>${(arr || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
    return `<article>${title}<div class="cols">${col(d.leftLabel || "A favor", d.left)}${col(d.rightLabel || "En contra", d.right)}</div></article>`;
  }
  if (t === "faq") {
    const items = (d.items || []).map((it) => `<details><summary>${esc(it.q)}</summary><p class="prose">${esc(it.a)}</p></details>`).join("");
    return `<article>${title}${items}</article>`;
  }
  if (t === "places" || t === "gallery") {
    const items = (d.items || []).map((it) => `<div class="card"><strong>${esc(it.title)}</strong><p>${esc(it.body || it.meta || "")}</p></div>`).join("");
    return `<article>${title}<div class="cards">${items}</div></article>`;
  }
  if (t === "prose") return `<article>${title}<p class="prose">${esc(d.text || "")}</p></article>`;
  if (t === "script") {
    return `<article data-script="${esc(b.id)}">${title}<textarea class="script">${esc(d.text || "")}</textarea><div class="actions"><button class="act" type="button" data-copy>Copiar</button><button class="ghost act" type="button" data-send>Enviar corrección a Grok</button></div><p class="toast" data-toast></p></article>`;
  }
  if (t === "video") {
    if (d.enc === true) {
      return `<article data-approve="${esc(b.id)}">${title}${encMedia("video", d, "")}<div class="actions"><button class="act" type="button" data-choice="go">GO</button><button class="ghost act" type="button" data-choice="changes">Pedir cambios</button></div><p class="toast" data-toast></p></article>`;
    }
    const src = safeMediaUrl(d.src || "");
    const poster = safeMediaUrl(d.poster || "");
    const player = src
      ? `<video controls playsinline preload="metadata"${poster ? ` poster="${esc(poster)}"` : ""} src="${esc(src)}"></video>${mediaActions(src, d.filename || "video.mp4")}`
      : deniedHint();
    return `<article data-approve="${esc(b.id)}">${title}${player}<div class="actions"><button class="act" type="button" data-choice="go">GO</button><button class="ghost act" type="button" data-choice="changes">Pedir cambios</button></div><p class="toast" data-toast></p></article>`;
  }
  if (t === "audio") {
    if (d.enc === true) return `<article>${title}${encMedia("audio", d, "")}</article>`;
    const src = safeMediaUrl(d.src || "");
    const player = src
      ? `<audio controls preload="metadata" src="${esc(src)}"></audio>${mediaActions(src, d.filename || "voz.mp3")}`
      : deniedHint();
    return `<article>${title}${player}</article>`;
  }
  if (t === "image") {
    if (d.enc === true) {
      return `<article data-approve="${esc(b.id)}">${title}${encMedia("image", d, d.alt || b.title || "")}<div class="actions"><button class="act" type="button" data-choice="go">GO</button><button class="ghost act" type="button" data-choice="changes">Pedir cambios</button></div><p class="toast" data-toast></p></article>`;
    }
    const src = safeMediaUrl(d.src || "");
    const player = src
      ? `<img class="still" alt="${esc(d.alt || b.title || "")}" src="${esc(src)}">${mediaActions(src, d.filename || "still.jpg")}`
      : deniedHint();
    return `<article data-approve="${esc(b.id)}">${title}${player}<div class="actions"><button class="act" type="button" data-choice="go">GO</button><button class="ghost act" type="button" data-choice="changes">Pedir cambios</button></div><p class="toast" data-toast></p></article>`;
  }
  if (t === "pipeline") {
    const steps = (d.steps || []).map((s) => {
      const state = allowToken(s.state, PIPE_STATES);
      return `<div class="step${state ? " " + state : ""}"><div class="dot"></div>${esc(s.label)}</div>`;
    }).join("");
    return `<article>${title}<div class="pipe">${steps}</div></article>`;
  }
  return `<article>${title}<p class="prose">${esc(JSON.stringify(d))}</p></article>`;
}

function render(scene) {
  document.title = scene.title || "Canvas";
  $("title").textContent = scene.title || "Canvas";
  const when = scene.updatedAt ? new Date(scene.updatedAt) : null;
  const stamp = when && !Number.isNaN(when.getTime())
    ? when.toLocaleString("es", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })
    : "";
  $("meta").textContent = stamp ? `Actualizado ${stamp}` : "Canvas";
  const change = $("change");
  if (scene.change) { change.hidden = false; change.textContent = scene.change; }
  else change.hidden = true;
  const main = $("main");
  const active = document.activeElement;
  if (active && main.contains(active) && active.tagName === "TEXTAREA") return;
  if ([...main.querySelectorAll("textarea")].some((el) => el.dataset.dirty === "1")) return;
  const signature = JSON.stringify(scene);
  if (signature === renderedScene && main.childElementCount) {
    retryFailedMedia(main);
    return;
  }
  renderedScene = signature;
  main.innerHTML = "";
  if (scene.summary) {
    const p = document.createElement("p");
    p.className = "summary";
    p.textContent = scene.summary;
    main.appendChild(p);
  }
  main.insertAdjacentHTML("beforeend", (scene.blocks || []).map(block).join(""));
  main.insertAdjacentHTML("beforeend", `<article><h2>Nota para Grok</h2><textarea class="script" data-note placeholder="Un cambio, una duda, un GO…"></textarea><div class="actions"><button class="act" type="button" data-note-send>Enviar a Grok</button></div><p class="toast" data-toast></p></article>`);
  main.querySelectorAll("button.check").forEach((btn) => {
    btn.addEventListener("click", () => {
      const on = btn.classList.toggle("on");
      btn.textContent = on ? "✓" : "";
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    });
  });
  main.querySelectorAll("article[data-script]").forEach((article) => {
    const area = article.querySelector("textarea");
    area.addEventListener("input", () => { area.dataset.dirty = "1"; });
    article.querySelector("[data-copy]").addEventListener("click", async () => {
      await navigator.clipboard.writeText(area.value);
      article.querySelector("[data-toast]").textContent = "Copiado";
    });
    article.querySelector("[data-send]").addEventListener("click", async () => {
      const toast = article.querySelector("[data-toast]");
      try {
        await sendFeedback({ kind: "script", blockId: article.dataset.script, text: area.value });
        area.dataset.dirty = "";
        toast.textContent = "Enviado. Escríbele a Grok «lee el canvas» y aplica la corrección.";
      } catch (err) {
        toast.textContent = "No se pudo enviar. Revisa el enlace.";
      }
    });
  });
  main.querySelectorAll("article[data-approve]").forEach((article) => {
    article.querySelectorAll("[data-choice]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const toast = article.querySelector("[data-toast]");
        try {
          await sendFeedback({ kind: "approve", blockId: article.dataset.approve, choice: btn.dataset.choice });
          toast.textContent = btn.dataset.choice === "go" ? "GO enviado a Grok." : "Cambios pedidos. Grok los lee cuando le escribas.";
        } catch (err) {
          toast.textContent = "No se pudo enviar.";
        }
      });
    });
  });
  const note = main.querySelector("[data-note]");
  note.addEventListener("input", () => { note.dataset.dirty = "1"; });
  main.querySelector("[data-note-send]").addEventListener("click", async () => {
    const toast = note.parentElement.querySelector("[data-toast]");
    try {
      await sendFeedback({ kind: "note", text: note.value });
      note.value = "";
      note.dataset.dirty = "";
      toast.textContent = "Nota enviada a Grok.";
    } catch (err) {
      toast.textContent = "No se pudo enviar.";
    }
  });
  hydrateEncryptedMedia(main);
}

async function load() {
  const sec = secret();
  if (!sec.b || !sec.k) {
    renderedScene = "";
    $("title").textContent = "Enlace incompleto";
    $("meta").textContent = "Hace falta la llave del enlace";
    $("main").innerHTML = `<p class="status">Este enlace no abre el canvas. Pídele a Grok el enlace completo, el que termina en #b=…</p>`;
    return;
  }
  const id = sec.b.replace(/[^a-zA-Z0-9_-]/g, "");
  const sameHost = location.hostname === "raw.githack.com" || location.hostname.endsWith("github.io") || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  const rawUrl = sameHost
    ? `scenes/${id}.json?t=${Date.now()}`
    : `https://raw.githack.com/JorgeDeArmas/grok-canvas/main/scenes/${id}.json?t=${Date.now()}`;
  const url = safeHttpsUrl(rawUrl);
  try {
    if (!url) throw new Error("url");
    const res = await fetch(url, { cache: "no-store", referrerPolicy: "no-referrer" });
    if (!res.ok) throw new Error(String(res.status));
    render(await decryptScene(await res.json(), sec.k));
  } catch (err) {
    if (document.activeElement && document.activeElement.tagName === "TEXTAREA") return;
    renderedScene = "";
    $("meta").textContent = "No se pudo abrir";
    $("main").innerHTML = `<p class="status">La llave no abre esta escena o el archivo aún no está publicado.</p>`;
  }
}

load();
setInterval(load, 15000);
</script>
