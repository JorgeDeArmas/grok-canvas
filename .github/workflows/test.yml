name: test
on:
  push:
  pull_request:
jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm test
      - name: gitleaks-style secret check
        run: bash scripts/check-secrets.sh
