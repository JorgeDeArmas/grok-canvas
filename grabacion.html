<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self' https://webhook.site; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Grabación</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7; --card: #fff; --text: #1c1c1e; --muted: #6e6e73; --line: rgba(60,60,67,.14);
    --accent: #007aff; --good: #34c759; --warn: #ff9500; --bad: #ff3b30; --chip: #e9e9ee; --soft: #f7f7fa;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --line: rgba(255,255,255,.10);
      --accent: #0a84ff; --chip: #2c2c2e; --soft: #242426; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 4; padding: calc(10px + var(--safe-t)) 14px 10px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px); border-bottom: 1px solid var(--line); }
  .top { max-width: 1180px; margin: 0 auto; }
  .hrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 24px; margin: 0; letter-spacing: -.02em; }
  .sync { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .sync i { width: 8px; height: 8px; border-radius: 4px; background: var(--good); display: inline-block; }
  .sync.pend i { background: var(--warn); }
  .sync button { border: 0; background: var(--chip); color: var(--text); border-radius: 8px; padding: 4px 8px; font: 600 12.5px -apple-system, sans-serif; cursor: pointer; }
  .wk { margin-top: 8px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .wk b { color: var(--text); }
  .pbar { height: 8px; border-radius: 4px; background: var(--chip); overflow: hidden; margin-top: 5px; }
  .pbar > span { display: block; height: 100%; background: var(--good); border-radius: 4px; transition: width .3s; }
  .pbar.sm { height: 5px; margin-top: 4px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--chip); border-radius: 10px; padding: 2px; margin-top: 10px; }
  .seg button { border: 0; background: transparent; color: var(--text); border-radius: 8px; min-height: 34px; font: 600 14px -apple-system, "Segoe UI", sans-serif; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .filters { display: flex; gap: 6px; margin-top: 8px; }
  .filters button { border: 1.5px solid var(--line); background: transparent; color: var(--text); border-radius: 999px; padding: 5px 12px; font: 600 13px -apple-system, sans-serif; cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  main { max-width: 1180px; margin: 0 auto; padding: 12px 12px calc(28px + var(--safe-b)); }
  .day { margin-bottom: 18px; }
  .dayh { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 4px 0; }
  .dayh h2 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .dayh span { color: var(--muted); font-size: 13px; }
  .daybar { padding: 0 4px 6px; }
  details.plan { background: var(--card); border-radius: 14px; margin: 6px 0 10px; padding: 0 12px; }
  details.plan summary { min-height: 44px; display: flex; align-items: center; font-weight: 600; cursor: pointer; list-style: none; }
  details.plan summary::-webkit-details-marker { display: none; }
  details.plan summary::after { content: "›"; margin-left: auto; color: var(--muted); transform: rotate(90deg); font-size: 20px; }
  details.plan[open] summary::after { transform: rotate(-90deg); }
  .pl { display: grid; grid-template-columns: 92px 1fr; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .pl .w { color: var(--muted); font-variant-numeric: tabular-nums; }
  .pl .b { grid-column: 2; color: var(--muted); font-size: 13.5px; }
  .blk { margin: 12px 0 6px; }
  .blkh { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 0 4px 6px; display: flex; justify-content: space-between; }
  .prod { background: var(--card); border-radius: 16px; padding: 10px 12px 4px; margin-bottom: 10px; }
  .prodh { display: flex; align-items: center; gap: 10px; }
  .prodh img, .prodh .ph { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; flex: none; background: var(--chip); }
  .prodh .nm { flex: 1; min-width: 0; }
  .prodh .nm b { display: block; font-size: 16px; }
  .prodh .nm span { font-size: 12.5px; color: var(--muted); }
  .vids { display: grid; gap: 0; }
  @media (min-width: 900px) {
    main { padding: 18px 20px 30px; }
    .blks { display: grid; grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); gap: 0 16px; align-items: start; }
  }
  .vid { border-top: 1px solid var(--line); padding: 10px 0 8px; }
  .vid.done .vt { color: var(--muted); }
  .vrow { display: flex; gap: 10px; align-items: flex-start; }
  .vt { font-size: 16.5px; font-weight: 650; line-height: 1.25; }
  .vh { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .chip { padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--chip); white-space: nowrap; }
  .chip.g { background: color-mix(in srgb, var(--good) 22%, transparent); }
  .chip.w { background: color-mix(in srgb, var(--warn) 22%, transparent); }
  .steps { display: flex; gap: 3px; margin-top: 8px; }
  .steps span { flex: 1; height: 4px; border-radius: 2px; background: var(--chip); }
  .steps span.on { background: var(--good); }
  .steps span.now { background: var(--accent); }
  .stl { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .stl b { color: var(--text); font-weight: 600; }
  .kit { font-size: 13.5px; margin-top: 7px; color: var(--text); }
  .kit span { color: var(--muted); }
  .acts { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
  a.btn, button.btn { min-height: 40px; padding: 0 14px; border-radius: 11px; border: 0; background: var(--accent); color: #fff;
    font: 600 14.5px/40px -apple-system, "Segoe UI", sans-serif; text-decoration: none; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  button.btn.sec { background: var(--chip); color: var(--text); }
  button.btn.ok { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--text); }
  .nob { font-size: 13px; color: var(--muted); align-self: center; }
  details.tk { margin-top: 8px; background: var(--soft); border-radius: 12px; }
  details.tk > summary { min-height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14.5px; cursor: pointer; list-style: none; }
  details.tk > summary::-webkit-details-marker { display: none; }
  details.tk > summary .cnt { margin-left: auto; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  details.tk > summary::after { content: "›"; color: var(--muted); transform: rotate(90deg); font-size: 20px; margin-left: 6px; }
  details.tk[open] > summary::after { transform: rotate(-90deg); }
  .shot { padding: 8px 12px 6px; border-top: 1px solid var(--line); }
  .shoth { display: flex; gap: 8px; align-items: baseline; }
  .shoth .n { flex: none; min-width: 26px; height: 22px; border-radius: 11px; background: var(--text); color: var(--bg); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
  .shoth .d { font-size: 13.5px; color: var(--muted); }
  .take { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 0 4px 2px; cursor: pointer; user-select: none; }
  .cb { width: 30px; height: 30px; border-radius: 9px; border: 2px solid color-mix(in srgb, var(--muted) 60%, transparent); flex: none;
    display: inline-flex; align-items: center; justify-content: center; font-size: 18px; color: #fff; background: transparent; transition: background .15s, border-color .15s; padding: 0; cursor: pointer; }
  .take[aria-checked="true"] .cb, .cb[aria-checked="true"] { background: var(--good); border-color: var(--good); }
  .take .tl { flex: 1; min-width: 0; font-size: 15px; }
  .take[aria-checked="true"] .tl { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
  .take .fn { font-size: 12px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  .opt { font-size: 11.5px; color: var(--muted); margin-left: 4px; }
  .take .ts { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .grph { padding: 10px 12px 2px; border-top: 1px solid var(--line); font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; }
  .grph span { color: var(--muted); font-weight: 500; }
  .grph + .take, .grph ~ .take { padding-left: 12px; padding-right: 12px; }
  .mode { display: flex; gap: 4px; padding: 0 12px 8px; }
  .mode button { border: 1.5px solid var(--line); background: transparent; color: var(--text); border-radius: 999px; padding: 3px 10px; font: 600 12.5px -apple-system, sans-serif; cursor: pointer; }
  .mode button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  details.props { margin-top: 6px; font-size: 13.5px; }
  details.props summary { cursor: pointer; color: var(--muted); min-height: 30px; display: flex; align-items: center; list-style: none; }
  details.props summary::-webkit-details-marker { display: none; }
  details.props ul { margin: 2px 0 4px; padding-left: 20px; }
  .empty { background: var(--card); border-radius: 16px; padding: 22px 16px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }
  .next { font-size: 13.5px; color: var(--muted); padding: 2px 4px 8px; }
  .toast { position: fixed; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%); z-index: 6; background: #1c1c1e; color: #fff;
    border-radius: 12px; padding: 10px 14px; font-size: 14px; display: none; gap: 14px; align-items: center; box-shadow: 0 4px 18px rgba(0,0,0,.25); max-width: calc(100% - 24px); }
  .toast.on { display: flex; }
  .toast button { background: transparent; border: 0; color: #64d2ff; font: 600 14px -apple-system, sans-serif; cursor: pointer; }
  .status { color: var(--muted); padding: 30px 16px; text-align: center; }
  .foot { color: var(--muted); font-size: 12.5px; text-align: center; padding: 4px 16px 20px; }
</style>
</head>
<body>
<header><div class="top">
  <div class="hrow"><h1 id="title">Grabación</h1><span class="sync" id="sync"></span></div>
  <div id="week"></div>
  <div class="seg" role="group" aria-label="Vista">
    <button type="button" data-view="hoy" aria-pressed="true">Qué falta hoy</button>
    <button type="button" data-view="semana" aria-pressed="false">Semana</button>
    <button type="button" data-view="todo" aria-pressed="false">Todo</button>
  </div>
  <div class="filters" id="filters" role="group" aria-label="Filtro">
    <button type="button" data-f="pend" aria-pressed="true">Pendiente</button>
    <button type="button" data-f="done" aria-pressed="false">Hecho</button>
    <button type="button" data-f="all" aria-pressed="false">Todo</button>
  </div>
</div></header>
<main id="main"><p class="status">Cargando…</p></main>
<div class="foot" id="foot"></div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button type="button" id="undo">Deshacer</button></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const TICK_RE = /^rec:[a-z0-9]{2,24}(:s\d{2}(:[a-z0-9]{1,8})?)?$/;
const THUMB_RE = /^data:image\/jpeg;base64,[A-Za-z0-9+/]+={0,2}$/;
const DAY_RE = /^(\d{4}-\d{2}-\d{2}|sin-fecha)$/;
const SYNC_EVERY = 10 * 60 * 1000;   // free mailbox takes ~100 requests: at most one sync every 10 min (or «Enviar ahora»)
const DAYS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const MONTHS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function txt(s, max) { return String(s ?? "").replace(/[\u0000-\u001F\u007F\u2028\u2029]/g, " ").replace(/\s+/g, " ").trim().slice(0, max || 300); }
function boardUrl(raw) {
  const t = String(raw ?? "").trim();
  if (!t || t.length > 2048 || /[\u0000-\u001F\u007F\\\s]/.test(t)) return "";
  let u; try { u = new URL(t); } catch (e) { return ""; }
  if (u.protocol !== "https:" || u.username || u.password || u.hostname !== "jorgedearmas.github.io" || !u.pathname.startsWith("/grok-canvas/")) return "";
  return u.href;
}
function secret() { const h = new URLSearchParams((location.hash || "").replace(/^#/, "")); return { b: h.get("b") || "", k: h.get("k") || "", f: h.get("f") || "" }; }
function b64urlToBytes(t) { const p = "=".repeat((4 - (t.length % 4)) % 4); const bin = atob(t.replace(/-/g, "+").replace(/_/g, "/") + p); return Uint8Array.from(bin, (c) => c.charCodeAt(0)); }
function b64ToBytes(t) { const bin = atob(t); return Uint8Array.from(bin, (c) => c.charCodeAt(0)); }
async function decryptScene(blob, keyText) {
  const key = await crypto.subtle.importKey("raw", b64urlToBytes(keyText), "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function localISO(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function dateOf(id) { const [y, m, d] = id.split("-").map(Number); return new Date(y, m - 1, d); }
function dayName(id) { if (id === "sin-fecha") return "Sin fecha"; const d = dateOf(id); return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }
function weekStart(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }

// ---- ticks: local first (instant), then batched to the mailbox ----
const slot = () => secret().b.replace(/[^a-z0-9]/gi, "");
function loadJSON(k, d) { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v && typeof v === "object" ? v : d; } catch (e) { return d; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function localTicks() {
  const raw = loadJSON("rec-ticks:" + slot(), {}); const out = {};
  for (const [k, v] of Object.entries(raw)) if (TICK_RE.test(k) && Array.isArray(v) && (v[0] === 0 || v[0] === 1) && typeof v[1] === "number") out[k] = v;
  return out;
}
function syncState() { const s = loadJSON("rec-sync:" + slot(), {}); return { last: Number(s.last) || 0, sentT: Number(s.sentT) || 0 }; }
function setSync(s) { saveJSON("rec-sync:" + slot(), s); }

let scene = null, view = "hoy", filt = "pend", undoFn = null, toastTimer = 0, syncTimer = 0, sig = "";
const openTk = new Set(), closedTk = new Set();
const modes = loadJSON("rec-modes", {});

function serverTicks() {
  const out = {}; const t = (scene && scene.ticks) || {};
  for (const [k, v] of Object.entries(t)) if (TICK_RE.test(k) && Array.isArray(v) && (v[0] === 0 || v[0] === 1) && typeof v[1] === "number") out[k] = v;
  return out;
}
function tickOn(id, L, S) { const a = L[id], b = S[id]; const w = a && (!b || a[1] >= b[1]) ? a : b; return !!(w && w[0] === 1); }

function videoProgress(v, L, S) {
  const vidOn = tickOn(v.id, L, S);
  let done = 0, req = 0;
  for (const sh of v.shots) for (const tk of sh.takes) {
    if (tk.optional) continue;
    req++; if (vidOn || tickOn(tk.id, L, S)) done++;
  }
  const filmed = vidOn || (req > 0 && done === req) || v.stage >= 2;
  return { done: filmed && v.stage >= 2 ? req : done, req, filmed, stage: Math.max(v.stage, filmed ? 2 : 0) };
}

function pendingCount() { const { sentT } = syncState(); return Object.values(localTicks()).filter((v) => v[1] > sentT).length; }

async function sendTicks(force, keepalive) {
  const box = (scene && UUID_RE.test(String(scene.mailbox || ""))) ? scene.mailbox : (UUID_RE.test(secret().f) ? secret().f : "");
  const st = syncState(); const L = localTicks();
  const set = {}; let maxT = st.sentT;
  for (const [k, v] of Object.entries(L)) if (v[1] > st.sentT) { set[k] = v; maxT = Math.max(maxT, v[1]); }
  if (!Object.keys(set).length) { drawSync(); return; }
  if (!box) { drawSync(); return; }
  const wait = st.last + SYNC_EVERY - Date.now();
  if (!force && wait > 0) { clearTimeout(syncTimer); syncTimer = setTimeout(() => sendTicks(false), wait + 500); drawSync(); return; }
  const endpoint = new URL("https://webhook.site/" + box);
  if (endpoint.origin !== "https://webhook.site" || endpoint.pathname !== "/" + box) return;
  const body = JSON.stringify({ kind: "ticks", v: 1, set, at: new Date().toISOString() });
  if (body.length > 60000) return;
  try {
    // text/plain = simple request: no CORS preflight, so one tick batch costs one mailbox request.
    const res = await fetch(endpoint.href, { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body, keepalive: !!keepalive,
      redirect: "error", referrerPolicy: "no-referrer", credentials: "omit", mode: "cors" });
    if (!res.ok) throw new Error(String(res.status));
    setSync({ last: Date.now(), sentT: maxT });
  } catch (e) { setSync({ last: Date.now(), sentT: st.sentT }); }
  drawSync();
}
function drawSync() {
  const n = pendingCount(); const el = $("sync");
  if (n) { el.className = "sync pend"; el.innerHTML = `<i></i>${n} en el teléfono <button type="button" id="sendNow">Enviar ahora</button>`; $("sendNow").onclick = () => sendTicks(true); }
  else { el.className = "sync"; el.innerHTML = `<i></i>Al día`; }
}

function setTick(ids, on) {
  const L = loadJSON("rec-ticks:" + slot(), {}); const t = Date.now(); const prev = {};
  for (const id of ids) { if (!TICK_RE.test(id)) continue; prev[id] = L[id]; L[id] = [on ? 1 : 0, t]; }
  saveJSON("rec-ticks:" + slot(), L);
  render(true); sendTicks(false);
  return prev;
}
function restore(prev) {
  const L = loadJSON("rec-ticks:" + slot(), {}); const t = Date.now();
  for (const [id, v] of Object.entries(prev)) L[id] = v ? [v[0], t] : [0, t];
  saveJSON("rec-ticks:" + slot(), L); render(true); sendTicks(false);
}

// ---- data ----
function cleanScene(s) {
  const products = {};
  for (const [k, p] of Object.entries(s.products || {})) products[k] = { name: txt(p.name, 60) || "Producto", thumb: THUMB_RE.test(String(p.thumb || "")) && String(p.thumb).length < 60000 ? p.thumb : "" };
  const videos = (Array.isArray(s.videos) ? s.videos : []).filter((v) => v && TICK_RE.test(String(v.id || "")) && DAY_RE.test(String(v.day || ""))).map((v) => ({
    id: v.id, day: v.day, place: txt(v.place, 30) || "Otro lugar", product: products[v.product] ? v.product : "", title: txt(v.title, 120), hook: txt(v.hook, 220),
    angle: txt(v.angle, 40), stage: Math.max(0, Math.min(5, Number(v.stage) || 0)), takeCount: Number(v.takeCount) || 0, set: txt(v.set, 100),
    outfit: (Array.isArray(v.outfit) ? v.outfit : []).map((x) => txt(x, 60)).filter(Boolean).slice(0, 6),
    props: (Array.isArray(v.props) ? v.props : []).map((x) => txt(x, 80)).filter(Boolean).slice(0, 14),
    board: boardUrl(v.board), mac: txt(v.mac, 60),
    shots: (Array.isArray(v.shots) ? v.shots : []).slice(0, 40).map((sh) => ({ n: Number(sh.n) || 0, do: txt(sh.do, 280), line: txt(sh.line, 220),
      takes: (Array.isArray(sh.takes) ? sh.takes : []).filter((t) => TICK_RE.test(String(t.id || ""))).slice(0, 8).map((t) => ({ id: t.id, label: txt(t.label, 120) || "Toma", side: txt(t.side, 40), who: txt(t.who, 70), wardrobe: txt(t.wardrobe, 60), group: txt(t.group, 60), file: txt(t.file, 40).replace(/[^\w.-]/g, ""), optional: !!t.optional })) }))
  }));
  const days = (Array.isArray(s.days) ? s.days : []).filter((d) => d && DAY_RE.test(String(d.id || ""))).map((d) => ({ id: d.id, planTitle: txt(d.planTitle, 80),
    plan: (Array.isArray(d.plan) ? d.plan : []).slice(0, 20).map((p) => ({ when: txt(p.when, 20), title: txt(p.title, 80), body: txt(p.body, 400) })) }));
  const stages = (Array.isArray(s.stages) && s.stages.length === 6 ? s.stages : ["Guion aprobado", "Pack listo", "Grabado", "Tomas en la Mac", "Editado", "Publicado"]).map((x) => txt(x, 30));
  const icons = {}; for (const [k, v] of Object.entries(s.icons || {})) icons[txt(k, 30)] = txt(v, 4);
  return { title: txt(s.title, 40) || "Grabación", updatedAt: s.updatedAt, products, videos, days, stages, icons, ticks: s.ticks || {}, mailbox: String(s.mailbox || "") };
}

// ---- render ----
function pct(a, b) { return b ? Math.round((100 * a) / b) : 0; }
function bar(a, b, sm) { return `<div class="pbar${sm ? " sm" : ""}"><span style="width:${pct(a, b)}%"></span></div>`; }

function targetDay(videos, L, S) {
  const today = localISO(new Date());
  const dated = [...new Set(videos.map((v) => v.day))].filter((d) => d !== "sin-fecha").sort();
  if (dated.includes(today)) return today;
  const pend = dated.filter((d) => videos.some((v) => v.day === d && !videoProgress(v, L, S).filmed));
  return pend.find((d) => d >= today) || pend[pend.length - 1] || dated.find((d) => d >= today) || "";
}

function videoHtml(v, L, S, openAll) {
  const p = videoProgress(v, L, S);
  const st = scene.stages;
  const steps = st.map((_, i) => `<span class="${i < p.stage ? "on" : i === p.stage ? "now" : ""}"></span>`).join("");
  const chips = [v.angle && `<span class="chip">${esc(v.angle)}</span>`, `<span class="chip">${esc(v.takeCount || p.req)} tomas</span>`, v.mac && `<span class="chip w">${esc(v.mac)}</span>`].filter(Boolean).join("");
  const kit = [v.outfit.length ? `<div class="kit"><span>Ropa:</span> ${esc(v.outfit.join(" · "))}</div>` : "",
    v.props.length ? `<details class="props"><summary>🧰 Props (${v.props.length}) ›</summary><ul>${v.props.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""].join("");
  const board = v.board ? `<a class="btn" href="${esc(v.board)}" target="_blank" rel="noopener noreferrer">Abrir board</a>` : `<span class="nob">Board en camino</span>`;
  const allBtn = p.filmed
    ? `<button type="button" class="btn ok" data-all="${esc(v.id)}" data-on="0">✓ Grabado</button>`
    : `<button type="button" class="btn sec" data-all="${esc(v.id)}" data-on="1">Marcar todo grabado</button>`;
  const vidOn = tickOn(v.id, L, S);
  const isOn = (tk) => vidOn || tickOn(tk.id, L, S) || v.stage >= 2;
  const row = (tk, title, sub) => { const on = isOn(tk); return `<div class="take" role="checkbox" tabindex="0" aria-checked="${on}" data-tick="${esc(tk.id)}"><span class="cb" aria-hidden="true">${on ? "✓" : ""}</span><span class="tl">${esc(title)}${tk.optional ? '<span class="opt">(opcional)</span>' : ""}${sub ? `<span class="ts">${esc(sub)}</span>` : ""}<span class="fn">${esc(tk.file)}</span></span></div>`; };
  const groups = [...new Set(v.shots.flatMap((sh) => sh.takes.map((t) => t.group)).filter(Boolean))];
  const mode = groups.length > 1 ? (modes[v.id] || "ropa") : "shot";
  let shots = "";
  if (mode === "ropa") {
    const order = [...groups, ""];
    for (const g of order) {
      const items = v.shots.flatMap((sh) => sh.takes.filter((t) => (t.group || "") === g).map((t) => ({ sh, t })));
      if (!items.length) continue;
      const dn = items.filter((x) => isOn(x.t)).length;
      shots += `<div class="grph">${g ? "👕 " + esc(g) : "Otras tomas"}<span>${dn}/${items.length}</span></div>` +
        items.map(({ sh, t }) => row(t, `Shot ${sh.n}${t.side && t.side !== "Toma" ? " · " + t.side : ""}${t.who ? " · " + t.who : ""}`, sh.do)).join("");
    }
  } else {
    shots = v.shots.map((sh) => `<div class="shot"><div class="shoth"><span class="n">${esc(sh.n)}</span><span class="d">${esc(sh.do)}</span></div>${sh.takes.map((tk) => row(tk, [tk.side, tk.who].filter(Boolean).join(" · ") || "Toma", tk.wardrobe)).join("")}</div>`).join("");
  }
  const modeBar = groups.length > 1 ? `<div class="mode"><button type="button" data-mode="ropa" data-mv="${esc(v.id)}" aria-pressed="${mode === "ropa"}">Por ropa</button><button type="button" data-mode="shot" data-mv="${esc(v.id)}" aria-pressed="${mode === "shot"}">Por shot</button></div>` : "";
  const isOpen = openTk.has(v.id) || (openAll && !p.filmed && !closedTk.has(v.id));
  return `<div class="vid${p.filmed ? " done" : ""}" data-v="${esc(v.id)}">
    <div class="vt">${p.filmed ? "✓ " : ""}${esc(v.title)}</div>
    ${v.hook ? `<div class="vh">«${esc(v.hook)}»</div>` : ""}
    <div class="chips">${chips}</div>
    <div class="steps" aria-hidden="true">${steps}</div>
    <div class="stl">Paso: <b>${esc(st[p.stage])}</b>${p.stage < 5 ? ` · sigue: ${esc(st[p.stage + 1])}` : ""}</div>
    ${kit}
    <div class="acts">${board}${allBtn}</div>
    ${v.shots.length ? `<details class="tk" data-tk="${esc(v.id)}"${isOpen ? " open" : ""}><summary>Tomas<span class="cnt">${p.done}/${p.req}</span></summary>${bar(p.done, p.req, true).replace('class="pbar sm"', 'class="pbar sm" style="margin:0 12px 8px"')}${modeBar}${shots}</details>` : ""}
  </div>`;
}

function render(force) {
  if (!scene) return;
  const L = localTicks(), S = serverTicks();
  const next = JSON.stringify([scene.updatedAt, view, filt, L]);
  if (!force && next === sig) return;
  sig = next;
  document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  document.querySelectorAll("#filters button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === filt)));
  $("filters").style.display = view === "hoy" ? "none" : "flex";
  const vids = scene.videos;
  // week progress (week of the next shoot day)
  const td = targetDay(vids, L, S);
  const ws = weekStart(td ? dateOf(td) : new Date()); const we = new Date(ws); we.setDate(we.getDate() + 7);
  const inWeek = vids.filter((v) => v.day !== "sin-fecha" && dateOf(v.day) >= ws && dateOf(v.day) < we);
  let wd = 0, wr = 0, wv = 0;
  inWeek.forEach((v) => { const p = videoProgress(v, L, S); wd += p.done; wr += p.req; if (p.filmed) wv++; });
  $("week").innerHTML = inWeek.length ? `<div class="wk"><span>Semana del ${ws.getDate()} ${MONTHS[ws.getMonth()]}</span><span><b>${wv}/${inWeek.length}</b> videos · <b>${wd}/${wr}</b> tomas</span></div>${bar(wd, wr)}` : "";

  let list = vids, openAll = false, lead = "";
  if (view === "hoy") {
    openAll = true;
    list = td ? vids.filter((v) => v.day === td) : [];
    const pend = list.filter((v) => !videoProgress(v, L, S).filmed);
    const today = localISO(new Date());
    lead = td && td !== today ? `<div class="next">Hoy no hay grabación. Lo próximo: <b>${esc(cap(dayName(td)))}</b>.</div>` : "";
    if (list.length && !pend.length) {
      $("main").innerHTML = lead + `<div class="empty"><b>¡Todo grabado! 🎉</b>Pasa las tomas a la Mac con los nombres de cada board.</div>`;
      bind(); drawSync(); return;
    }
    list = pend;
  } else {
    if (view === "semana") list = vids.filter((v) => v.day === "sin-fecha" || (dateOf(v.day) >= ws && dateOf(v.day) < we));
    if (filt === "pend") list = list.filter((v) => !videoProgress(v, L, S).filmed);
    if (filt === "done") list = list.filter((v) => videoProgress(v, L, S).filmed);
  }
  if (!list.length) {
    $("main").innerHTML = lead + `<div class="empty"><b>${filt === "done" && view !== "hoy" ? "Nada grabado todavía" : "Nada pendiente"}</b>${view === "hoy" ? "Cuando haya boards listos para grabar salen aquí." : "Cambia el filtro para ver el resto."}</div>`;
    bind(); drawSync(); return;
  }
  let html = lead;
  const dayIds = [...new Set(list.map((v) => v.day))];
  for (const d of dayIds) {
    const dv = list.filter((v) => v.day === d);
    const allDay = vids.filter((v) => v.day === d);
    let dd = 0, dr = 0; allDay.forEach((v) => { const p = videoProgress(v, L, S); dd += p.done; dr += p.req; });
    const meta = scene.days.find((x) => x.id === d) || { plan: [] };
    html += `<section class="day"><div class="dayh"><h2>${esc(cap(dayName(d)))}</h2><span>${dd}/${dr} tomas</span></div><div class="daybar">${bar(dd, dr)}</div>`;
    if (meta.plan.length) html += `<details class="plan"><summary>Plan del día${meta.planTitle ? " · " + esc(meta.planTitle) : ""}</summary>${meta.plan.map((p) => `<div class="pl"><span class="w">${esc(p.when)}</span><b>${esc(p.title)}</b>${p.body ? `<span class="b">${esc(p.body)}</span>` : ""}</div>`).join("")}</details>`;
    const places = [...new Set(dv.map((v) => v.place))];
    html += `<div class="blks">`;
    for (const pl of places) {
      const pv = dv.filter((v) => v.place === pl);
      html += `<div class="blk"><div class="blkh"><span>${esc(scene.icons[pl] || "📍")} ${esc(pl)}</span><span>${pv.length} video${pv.length === 1 ? "" : "s"}</span></div><div class="blkgrid">`;
      const prods = [...new Set(pv.map((v) => v.product))];
      for (const pk of prods) {
        const prv = pv.filter((v) => v.product === pk);
        const prod = scene.products[pk] || { name: "Producto", thumb: "" };
        const allProd = pv.filter((v) => v.product === pk).length ? vids.filter((v) => v.day === d && v.place === pl && v.product === pk) : [];
        const fv = allProd.filter((v) => videoProgress(v, L, S).filmed).length;
        const img = prod.thumb ? `<img alt="" src="${esc(prod.thumb)}">` : `<span class="ph"></span>`;
        html += `<div class="prod"><div class="prodh">${img}<div class="nm"><b>${esc(prod.name)}</b><span>${fv}/${allProd.length} video${allProd.length === 1 ? "" : "s"} grabado${allProd.length === 1 ? "" : "s"}</span>${bar(fv, allProd.length, true)}</div></div><div class="vids">${prv.map((v) => videoHtml(v, L, S, openAll)).join("")}</div></div>`;
      }
      html += `</div></div>`;
    }
    html += `</div></section>`;
  }
  $("main").innerHTML = html;
  bind(); drawSync();
}

function bind() {
  document.querySelectorAll("[data-tick]").forEach((el) => {
    const go = () => {
      const id = el.dataset.tick; const on = el.getAttribute("aria-checked") !== "true";
      const vid = el.closest("[data-v]").dataset.v;
      const L = localTicks(), S = serverTicks();
      if (!on && tickOn(vid, L, S)) {   // unticking one take of a «todo grabado» video: keep the others ticked
        const v = scene.videos.find((x) => x.id === vid);
        const others = v.shots.flatMap((s) => s.takes.map((t) => t.id)).filter((x) => x !== id);
        setTick(others, true); setTick([vid], false);
      }
      setTick([id], on);
      if (navigator.vibrate) try { navigator.vibrate(8); } catch (e) {}
    };
    el.addEventListener("click", go);
    el.addEventListener("keydown", (e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); go(); } });
  });
  document.querySelectorAll("[data-all]").forEach((b) => b.addEventListener("click", () => {
    const id = b.dataset.all, on = b.dataset.on === "1";
    const v = scene.videos.find((x) => x.id === id);
    const ids = on ? [id] : [id, ...v.shots.flatMap((s) => s.takes.map((t) => t.id))];
    const prev = setTick(ids, on);
    toast(on ? "Video marcado como grabado ✓" : "Desmarcado", () => restore(prev));
  }));
  document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => { modes[b.dataset.mv] = b.dataset.mode; saveJSON("rec-modes", modes); openTk.add(b.dataset.mv); render(true); }));
  // only user taps change what stays open (the browser also fires «toggle» when a render inserts an open <details>)
  document.querySelectorAll("details.tk > summary").forEach((sm) => sm.addEventListener("click", () => { const d = sm.parentElement; if (d.open) { openTk.delete(d.dataset.tk); closedTk.add(d.dataset.tk); } else { openTk.add(d.dataset.tk); closedTk.delete(d.dataset.tk); } }));
}

function toast(msg, onUndo) {
  $("toastMsg").textContent = msg; undoFn = onUndo || null; $("undo").hidden = !onUndo;
  $("toast").classList.add("on"); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").classList.remove("on"); undoFn = null; }, 5000);
}
$("undo").addEventListener("click", () => { if (undoFn) undoFn(); $("toast").classList.remove("on"); });
document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => { view = b.dataset.view; try { localStorage.setItem("rec-view", view); } catch (e) {} render(true); window.scrollTo(0, 0); }));
document.querySelectorAll("#filters button").forEach((b) => b.addEventListener("click", () => { filt = b.dataset.f; render(true); }));
try { const v = localStorage.getItem("rec-view"); if (["hoy", "semana", "todo"].includes(v)) view = v; } catch (e) {}

async function load() {
  const sec = secret();
  if (!sec.b || !sec.k) { $("main").innerHTML = `<p class="status">Este enlace está incompleto. Pídele a Grok el enlace completo.</p>`; return; }
  const okHost = location.hostname.endsWith("github.io") || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if (!okHost) { $("main").innerHTML = `<p class="status">Abre este enlace desde jorgedearmas.github.io.</p>`; return; }
  const id = sec.b.replace(/[^a-zA-Z0-9_-]/g, "");
  try {
    const res = await fetch(`scenes/${id}.json?t=${Date.now()}`, { cache: "no-store", referrerPolicy: "no-referrer" });
    if (!res.ok) throw new Error(String(res.status));
    const next = await decryptScene(await res.json(), sec.k);
    if (!next || next.type !== "filming") throw new Error("type");
    const was = scene && scene.updatedAt;
    scene = cleanScene(next);
    const when = scene.updatedAt ? new Date(scene.updatedAt) : null;
    $("foot").textContent = when && !Number.isNaN(when.getTime()) ? "Actualizado " + when.toLocaleString("es", { weekday: "short", hour: "numeric", minute: "2-digit" }) + ". Tus marcas se guardan en este teléfono al instante." : "";
    render(was !== scene.updatedAt);
    sendTicks(false);
  } catch (e) {
    if (scene) return;
    $("main").innerHTML = `<p class="status">No se pudo abrir. La llave no coincide o todavía se está publicando.</p>`;
  }
}
load();
setInterval(load, 120000);
document.addEventListener("visibilitychange", () => { if (document.hidden) sendTicks(false, true); else load(); });
</script>
</body>
</html>
