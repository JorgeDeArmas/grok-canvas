<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self' https://webhook.site; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">
<meta name="theme-color" content="#f2f2f7">
<title>Grabación</title>
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --text: #1c1c1e; --muted: #6e6e73; --line: rgba(60,60,67,.14);
    --accent: #007aff; --good: #34c759; --chip: #e9e9ee; --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --line: rgba(255,255,255,.10); --accent: #0a84ff; --chip: #2c2c2e; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 3; padding: calc(10px + var(--safe-t)) 16px 10px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px); border-bottom: 1px solid var(--line); }
  .top, main { max-width: 760px; margin: 0 auto; }
  .hrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; }
  .sync { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .sync button { border: 0; background: var(--chip); color: var(--text); border-radius: 8px; padding: 4px 9px; margin-left: 4px; font: 600 12.5px -apple-system, sans-serif; cursor: pointer; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--chip); border-radius: 10px; padding: 2px; margin-top: 10px; }
  .seg button { border: 0; background: transparent; color: var(--text); border-radius: 8px; min-height: 34px; font: 600 14.5px -apple-system, "Segoe UI", sans-serif; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  main { padding: 14px 12px calc(28px + var(--safe-b)); }
  .day { margin-bottom: 22px; }
  .day h2 { font-size: 20px; margin: 0 4px; letter-spacing: -.01em; }
  .day .cnt { color: var(--muted); font-size: 14px; margin: 2px 4px 10px; }
  .place { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 12px 4px 6px; }
  .list { background: var(--card); border-radius: 16px; overflow: hidden; }
  .card { display: flex; align-items: center; gap: 12px; padding: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .card:first-child { border-top: 0; }
  .card img, .card .ph { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; background: var(--chip); flex: none; }
  .nm { flex: 1; min-width: 150px; }
  .nm b { display: block; font-size: 16.5px; }
  .nm span { display: block; font-size: 14px; color: var(--muted); margin-top: 1px; }
  .card.done .nm b::before { content: "✓ "; color: var(--good); }
  .bt { display: flex; gap: 8px; margin-left: auto; }
  a.btn, button.btn { min-height: 40px; padding: 0 14px; border-radius: 11px; border: 0; background: var(--accent); color: #fff; text-decoration: none; cursor: pointer;
    font: 600 14.5px/40px -apple-system, "Segoe UI", sans-serif; white-space: nowrap; }
  button.btn.sec { background: var(--chip); color: var(--text); }
  .soon { font-size: 13px; color: var(--muted); margin-left: auto; }
  @media (max-width: 480px) { .bt { width: 100%; padding-left: 68px; } .bt > * { flex: 1; text-align: center; } }
  .empty { background: var(--card); border-radius: 16px; padding: 22px 16px; text-align: center; color: var(--muted); }
  .empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }
  .toast { position: fixed; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%); z-index: 5; background: #1c1c1e; color: #fff; border-radius: 12px;
    padding: 10px 14px; font-size: 14px; display: none; gap: 14px; align-items: center; box-shadow: 0 4px 18px rgba(0,0,0,.25); }
  .toast.on { display: flex; }
  .toast button { background: transparent; border: 0; color: #64d2ff; font: 600 14px -apple-system, sans-serif; cursor: pointer; }
  .status { color: var(--muted); padding: 30px 16px; text-align: center; }
</style>
</head>
<body>
<header><div class="top">
  <div class="hrow"><h1>Grabación</h1><span class="sync" id="sync"></span></div>
  <div class="seg" role="group" aria-label="Vista">
    <button type="button" data-view="pend" aria-pressed="true">Pendientes</button>
    <button type="button" data-view="done" aria-pressed="false">Grabados</button>
  </div>
</div></header>
<main id="main"><p class="status">Cargando…</p></main>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button type="button" id="undo">Deshacer</button></div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const VID_RE = /^rec:[a-z0-9]{2,24}$/;
const THUMB_RE = /^data:image\/jpeg;base64,[A-Za-z0-9+/]+={0,2}$/;
const DAY_RE = /^(\d{4}-\d{2}-\d{2}|sin-fecha)$/;
const SYNC_EVERY = 5 * 60 * 1000;   // free mailbox ≈ 100 requests: one batch every 5 min at most (or «Enviar»)
const DAYS = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
const MONTHS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function txt(s, max) { return String(s ?? "").replace(/[\u0000-\u001F\u007F\u2028\u2029]/g, " ").replace(/\s+/g, " ").trim().slice(0, max || 120); }
function boardUrl(raw) {
  const t = String(raw ?? "").trim();
  if (!t || t.length > 2048 || /[\u0000-\u001F\u007F\\\s]/.test(t)) return "";
  let u; try { u = new URL(t); } catch (e) { return ""; }
  if (u.protocol !== "https:" || u.username || u.password || u.hostname !== "jorgedearmas.github.io" || !u.pathname.startsWith("/grok-canvas/")) return "";
  return u.href;
}
function secret() { const h = new URLSearchParams((location.hash || "").replace(/^#/, "")); return { b: h.get("b") || "", k: h.get("k") || "", f: h.get("f") || "" }; }
function b64urlToBytes(t) { const p = "=".repeat((4 - (t.length % 4)) % 4); const bin = atob(t.replace(/-/g, "+").replace(/_/g, "/") + p); return Uint8Array.from(bin, (c) => c.charCodeAt(0)); }
function b64ToBytes(t) { const bin = atob(t); return Uint8Array.from(bin, (c) => c.charCodeAt(0)); }
async function decryptScene(blob, keyText) {
  const key = await crypto.subtle.importKey("raw", b64urlToBytes(keyText), "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function dayName(id) { if (id === "sin-fecha") return "Sin fecha"; const [y, m, d] = id.split("-").map(Number); const x = new Date(y, m - 1, d); const s = `${DAYS[x.getDay()]} ${d} ${MONTHS[m - 1]}`; return s[0].toUpperCase() + s.slice(1); }

// ---- marks: on the phone instantly, then batched to the mailbox ----
const slot = () => secret().b.replace(/[^a-z0-9]/gi, "");
function loadJSON(k, d) { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v && typeof v === "object" ? v : d; } catch (e) { return d; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function validTicks(raw) { const out = {}; for (const [k, v] of Object.entries(raw || {})) if (VID_RE.test(k) && Array.isArray(v) && (v[0] === 0 || v[0] === 1) && typeof v[1] === "number") out[k] = v; return out; }
const localTicks = () => validTicks(loadJSON("rec-ticks:" + slot(), {}));
function syncState() { const s = loadJSON("rec-sync:" + slot(), {}); return { last: Number(s.last) || 0, sentT: Number(s.sentT) || 0 }; }

let scene = null, view = "pend", undoFn = null, toastTimer = 0, syncTimer = 0;

function isFilmed(v, L) {
  const a = L[v.id], b = scene.ticks[v.id];
  const w = a && (!b || a[1] >= b[1]) ? a : b;
  return w ? w[0] === 1 : v.stage >= 2;
}
function pendingCount() { const { sentT } = syncState(); return Object.values(localTicks()).filter((v) => v[1] > sentT).length; }
function drawSync() {
  const n = pendingCount(), el = $("sync");
  if (n) { el.innerHTML = `${n} sin enviar<button type="button" id="sendNow">Enviar</button>`; $("sendNow").onclick = () => sendTicks(true); }
  else el.textContent = "Al día ✓";
}
async function sendTicks(force, keepalive) {
  const box = scene && UUID_RE.test(scene.mailbox) ? scene.mailbox : (UUID_RE.test(secret().f) ? secret().f : "");
  const st = syncState(), set = {}; let maxT = st.sentT;
  for (const [k, v] of Object.entries(localTicks())) if (v[1] > st.sentT) { set[k] = v; maxT = Math.max(maxT, v[1]); }
  if (!box || !Object.keys(set).length) { drawSync(); return; }
  const wait = st.last + SYNC_EVERY - Date.now();
  if (!force && wait > 0) { clearTimeout(syncTimer); syncTimer = setTimeout(() => sendTicks(false), wait + 500); drawSync(); return; }
  const endpoint = new URL("https://webhook.site/" + box);
  if (endpoint.origin !== "https://webhook.site" || endpoint.pathname !== "/" + box) return;
  const body = JSON.stringify({ kind: "ticks", v: 2, set, at: new Date().toISOString() });
  try {
    // text/plain = simple request (no CORS preflight): one batch = one mailbox request
    const res = await fetch(endpoint.href, { method: "POST", headers: { "Content-Type": "text/plain;charset=UTF-8" }, body, keepalive: !!keepalive,
      redirect: "error", referrerPolicy: "no-referrer", credentials: "omit", mode: "cors" });
    if (!res.ok) throw new Error(String(res.status));
    saveJSON("rec-sync:" + slot(), { last: Date.now(), sentT: maxT });
  } catch (e) { saveJSON("rec-sync:" + slot(), { last: Date.now(), sentT: st.sentT }); }
  drawSync();
}
function setMark(id, on) {
  const L = loadJSON("rec-ticks:" + slot(), {}); const prev = L[id];
  L[id] = [on ? 1 : 0, Date.now()]; saveJSON("rec-ticks:" + slot(), L);
  render(); sendTicks(false);
  return prev;
}

function cleanScene(s) {
  const products = {};
  for (const [k, p] of Object.entries(s.products || {})) products[k] = { name: txt(p.name, 50) || "Producto", thumb: THUMB_RE.test(String(p.thumb || "")) && String(p.thumb).length < 60000 ? p.thumb : "" };
  const videos = (Array.isArray(s.videos) ? s.videos : []).filter((v) => v && VID_RE.test(String(v.id || "")) && DAY_RE.test(String(v.day || ""))).map((v) => ({
    id: v.id, day: v.day, place: txt(v.place, 24), product: products[v.product] ? v.product : "", title: txt(v.title, 70),
    stage: Math.max(0, Math.min(5, Number(v.stage) || 0)), board: boardUrl(v.board), ready: !!v.ready }));
  return { updatedAt: s.updatedAt, products, videos, ticks: validTicks(s.ticks), mailbox: String(s.mailbox || "") };
}

function cardHtml(v, L) {
  const p = scene.products[v.product] || { name: "Producto", thumb: "" };
  const done = isFilmed(v, L), ready = v.ready && v.board;
  const img = p.thumb ? `<img alt="" src="${esc(p.thumb)}">` : `<span class="ph"></span>`;
  const btns = ready
    ? `<div class="bt"><a class="btn" href="${esc(v.board)}" target="_blank" rel="noopener noreferrer">Abrir board</a>${done
        ? `<button type="button" class="btn sec" data-mark="${esc(v.id)}" data-on="0">Desmarcar</button>`
        : `<button type="button" class="btn sec" data-mark="${esc(v.id)}" data-on="1">Marcar grabado</button>`}</div>`
    : `<span class="soon">Board en camino</span>`;
  const sub = v.title && v.title !== p.name ? `<span>${esc(v.title)}</span>` : "";
  return `<div class="card${done ? " done" : ""}" data-v="${esc(v.id)}">${img}<div class="nm"><b>${esc(p.name)}</b>${sub}</div>${btns}</div>`;
}

function render() {
  if (!scene) return;
  const L = localTicks();
  document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  const days = [...new Set(scene.videos.map((v) => v.day))];
  let html = "";
  for (const d of days) {
    const all = scene.videos.filter((v) => v.day === d);
    const ready = all.filter((v) => v.ready && v.board);
    const nDone = ready.filter((v) => isFilmed(v, L)).length, soon = all.length - ready.length;
    const list = all.filter((v) => (view === "done") === isFilmed(v, L));
    if (!list.length) continue;
    const head = view === "done" ? `${nDone} grabado${nDone === 1 ? "" : "s"}`
      : `${ready.length} video${ready.length === 1 ? "" : "s"} listo${ready.length === 1 ? "" : "s"} para grabar · ${nDone} de ${ready.length} grabado${ready.length === 1 ? "" : "s"}${soon ? ` · ${soon} en camino` : ""}`;
    html += `<section class="day"><h2>${esc(dayName(d))}</h2><div class="cnt">${esc(head)}</div>`;
    const places = [...new Set(list.map((v) => v.place))];
    for (const pl of places) {
      const pv = list.filter((v) => v.place === pl);
      if (places.length > 1 && pl) html += `<div class="place">${esc(pl)}</div>`;
      html += `<div class="list">${pv.map((v) => cardHtml(v, L)).join("")}</div>`;
    }
    html += `</section>`;
  }
  $("main").innerHTML = html || (view === "done"
    ? `<div class="empty"><b>Nada grabado todavía</b>Cuando marques un video, sale aquí.</div>`
    : `<div class="empty"><b>¡Todo grabado! 🎉</b>Pasa las tomas a la Mac con los nombres de cada board.</div>`);
  document.querySelectorAll("[data-mark]").forEach((b) => b.addEventListener("click", () => {
    const id = b.dataset.mark, on = b.dataset.on === "1";
    const prev = setMark(id, on);
    toast(on ? "Marcado como grabado ✓" : "Desmarcado", () => {
      const L2 = loadJSON("rec-ticks:" + slot(), {}); L2[id] = [prev ? prev[0] : (on ? 0 : 1), Date.now()];
      saveJSON("rec-ticks:" + slot(), L2); render(); sendTicks(false);
    });
  }));
  drawSync();
}
function toast(msg, onUndo) {
  $("toastMsg").textContent = msg; undoFn = onUndo || null; $("undo").hidden = !onUndo;
  $("toast").classList.add("on"); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").classList.remove("on"); undoFn = null; }, 5000);
}
$("undo").addEventListener("click", () => { if (undoFn) undoFn(); $("toast").classList.remove("on"); });
document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => { view = b.dataset.view; render(); window.scrollTo(0, 0); }));

async function load() {
  const sec = secret();
  if (!sec.b || !sec.k) { $("main").innerHTML = `<p class="status">Este enlace está incompleto. Pídele a Grok el enlace completo.</p>`; return; }
  const okHost = location.hostname.endsWith("github.io") || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if (!okHost) { $("main").innerHTML = `<p class="status">Abre este enlace desde jorgedearmas.github.io.</p>`; return; }
  try {
    const res = await fetch(`scenes/${sec.b.replace(/[^a-zA-Z0-9_-]/g, "")}.json?t=${Date.now()}`, { cache: "no-store", referrerPolicy: "no-referrer" });
    if (!res.ok) throw new Error(String(res.status));
    const next = await decryptScene(await res.json(), sec.k);
    if (!next || next.type !== "filming") throw new Error("type");
    scene = cleanScene(next); render(); sendTicks(false);
  } catch (e) {
    if (!scene) $("main").innerHTML = `<p class="status">No se pudo abrir. La llave no coincide o todavía se está publicando.</p>`;
  }
}
load();
setInterval(load, 120000);
document.addEventListener("visibilitychange", () => { if (document.hidden) sendTicks(false, true); else load(); });
</script>
</body>
</html>
