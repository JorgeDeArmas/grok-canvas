<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob: https://cdn.jsdelivr.net; media-src 'self' blob: https://cdn.jsdelivr.net https://*.workers.dev; connect-src 'self' https://webhook.site https://cdn.jsdelivr.net https://*.workers.dev https://*.r2.cloudflarestorage.com; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Comando</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7; --card: #fff; --card2: #f7f7fa; --text: #1c1c1e; --muted: #6e6e73;
    --line: rgba(60,60,67,.14); --accent: #007aff; --accent-ink: #fff; --good: #248a3d; --good-bg: #34c759;
    --bad: #d70015; --warn: #c93400; --warn-bg: #ff9500; --info: #5e5ce6; --chip: #e9e9ee;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(0,0,0,.06);
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --card2: #2c2c2e; --text: #f5f5f7; --muted: #a1a1a6;
      --line: rgba(255,255,255,.12); --accent: #0a84ff; --good: #30d158; --good-bg: #30d158; --bad: #ff453a;
      --warn: #ff9f0a; --warn-bg: #ff9f0a; --info: #7d7aff; --chip: #3a3a3c; --shadow: none; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body.lock .toast { top: calc(10px + var(--safe-t)); bottom: auto; } /* sheet open: never cover its button */
  html, body { margin: 0; }
  body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
  body.lock { overflow: hidden; }
  button, a { font: inherit; }
  header { position: sticky; top: 0; z-index: 3; padding: calc(10px + var(--safe-t)) 16px 10px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px);
    border-bottom: 1px solid var(--line); }
  .top { max-width: 1100px; margin: 0 auto; }
  .hrow { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; }
  .meta { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .counters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .ctr { appearance: none; border: 0; text-align: left; background: var(--card); color: var(--text); border-radius: 14px;
    padding: 8px 10px; min-height: 56px; cursor: pointer; box-shadow: var(--shadow); }
  .ctr b { display: block; font-size: 22px; line-height: 1.1; letter-spacing: -.02em; }
  .ctr span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .ctr.hot b { color: var(--accent); }
  .ctr.z b { color: var(--muted); }
  .ctr:active { transform: scale(.97); }
  .quick { display: flex; gap: 8px; margin-top: 8px; }
  .quick:empty { display: none; }
  .quick a { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; padding: 8px 14px; border-radius: 14px;
    background: var(--card); color: var(--text); text-decoration: none; font-weight: 600; font-size: 15px; }
  .quick a span { color: var(--muted); font-weight: 500; font-size: 13px; white-space: nowrap; }
  .quick a::after { content: "›"; color: var(--muted); font-size: 22px; line-height: 1; margin-left: 2px; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 12px 8px; display: grid; gap: 14px; grid-template-columns: 1fr; align-items: start; }
  .rest { display: grid; gap: 14px; min-width: 0; }
  @media (min-width: 860px) { main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding: 16px 20px; } }
  /* Lo próximo */
  .next { background: var(--card); border-radius: 20px; padding: 14px; box-shadow: var(--shadow); border: 2px solid var(--accent); }
  .next.done { border-color: var(--good-bg); }
  .next .lbl { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .next.done .lbl { color: var(--good); }
  .next .row { display: flex; gap: 12px; align-items: center; }
  .next .h { font-size: 19px; font-weight: 700; line-height: 1.25; }
  .next .s { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .next .cta { margin-top: 12px; display: flex; gap: 8px; }
  .next .cta > * { flex: 1; }
  section { background: var(--card); border-radius: 18px; padding: 10px 10px 4px; min-width: 0; box-shadow: var(--shadow); scroll-margin-top: 150px; }
  section h2 { font-size: 17px; margin: 4px 6px 6px; display: flex; justify-content: space-between; align-items: baseline; }
  section h2 i { font-style: normal; color: var(--muted); font-weight: 500; font-size: 14px; }
  .grp { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 12px 6px 2px; scroll-margin-top: 150px; }
  .flash { animation: flash 1.2s ease; border-radius: 10px; }
  @keyframes flash { 0%,40% { background: color-mix(in srgb, var(--accent) 22%, transparent); } 100% { background: transparent; } }
  .it { display: flex; align-items: center; gap: 12px; padding: 10px 6px; min-height: 64px; border-top: 1px solid var(--line);
    border-radius: 12px; cursor: pointer; transition: opacity .25s, transform .25s, background .15s; }
  .grp + .it, h2 + .it { border-top: 0; }
  .it:active { background: var(--card2); }
  .it.gone { opacity: 0; transform: translateX(24px); }
  .th { width: 48px; height: 48px; border-radius: 12px; flex: none; object-fit: cover; background: var(--chip); display: grid; place-items: center;
    font-size: 21px; overflow: hidden; }
  .next .th { width: 60px; height: 60px; border-radius: 14px; }
  .t-warn .th.ic { background: color-mix(in srgb, var(--warn-bg) 22%, transparent); }
  .t-good .th.ic { background: color-mix(in srgb, var(--good-bg) 22%, transparent); }
  .t-bad .th.ic { background: color-mix(in srgb, var(--bad) 20%, transparent); }
  .t-info .th.ic { background: color-mix(in srgb, var(--info) 20%, transparent); }
  .tx { flex: 1; min-width: 0; }
  .ln { font-size: 16px; line-height: 1.3; }
  .ln b { font-weight: 650; }
  .quiet .ln { color: var(--muted); }
  .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .bt { display: flex; gap: 6px; flex: none; align-items: center; }
  .chev { color: var(--muted); font-size: 22px; padding: 0 2px 0 4px; flex: none; }
  .go, .ghost, .act, .copy, .done { appearance: none; min-height: 44px; padding: 0 14px; border-radius: 12px; border: 0; font-weight: 600; font-size: 15px;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer; white-space: nowrap; }
  .go { background: var(--accent); color: var(--accent-ink); }
  .ghost, .copy { background: var(--chip); color: var(--text); }
  .act { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
  .act:disabled { box-shadow: inset 0 0 0 1.5px var(--line); color: var(--muted); cursor: default; }
  .done { background: transparent; color: var(--good); box-shadow: inset 0 0 0 1.5px var(--line); }
  .done.round { width: 44px; padding: 0; border-radius: 22px; font-size: 18px; }
  .big { min-height: 52px; font-size: 17px; border-radius: 14px; width: 100%; }
  .chip { display: inline-block; vertical-align: 1px; margin-left: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 650;
    background: var(--chip); color: var(--text); white-space: nowrap; }
  .chip.c-warn { background: color-mix(in srgb, var(--warn-bg) 24%, transparent); }
  .chip.c-good { background: color-mix(in srgb, var(--good-bg) 24%, transparent); }
  .chip.c-bad { background: color-mix(in srgb, var(--bad) 22%, transparent); }
  .chip.c-info { background: color-mix(in srgb, var(--info) 22%, transparent); }
  .mailsub { color: var(--muted); font-size: 13px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .it.mob { flex-wrap: wrap; row-gap: 8px; }
  .it.mob .tx { flex-basis: calc(100% - 60px); }
  .it.mob .bt { flex-basis: 100%; padding-left: 60px; flex-wrap: wrap; }
  .empty { color: var(--muted); font-size: 15px; padding: 14px 6px 16px; }
  .more { color: var(--muted); font-size: 13px; padding: 6px 6px 10px; }
  .foot { max-width: 1100px; margin: 0 auto; padding: 4px 16px calc(28px + var(--safe-b)); color: var(--muted); font-size: 13px; }
  .foot p { margin: 4px 0; }
  details.note { margin-top: 12px; background: var(--card); border-radius: 16px; padding: 4px 12px; }
  details.note summary { min-height: 48px; display: flex; align-items: center; font-weight: 600; color: var(--text); cursor: pointer; }
  textarea { width: 100%; min-height: 90px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); font: 16px/1.4 -apple-system, "Segoe UI", sans-serif; padding: 10px; }
  .toast { position: fixed; left: 50%; bottom: calc(18px + var(--safe-b)); transform: translateX(-50%); z-index: 20; width: max-content; max-width: calc(100vw - 24px);
    background: #2c2c2e; color: #fff; border-radius: 14px; padding: 6px 6px 6px 16px; font-size: 15px; display: none; gap: 10px; align-items: center; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .toast.on { display: flex; }
  .toast button { background: transparent; border: 0; color: #64d2ff; font-weight: 650; min-height: 44px; padding: 0 12px; cursor: pointer; }
  .status { color: var(--muted); padding: 30px 16px; text-align: center; }
  /* Sheet */
  .scrim { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.42); opacity: 0; transition: opacity .2s; }
  .scrim.on { opacity: 1; }
  .sheet { position: fixed; z-index: 11; left: 0; right: 0; bottom: 0; max-height: calc(100dvh - 24px - var(--safe-t)); height: calc(100dvh - 24px - var(--safe-t));
    background: var(--bg); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .25s ease; }
  .sheet.short { height: auto; }
  .sheet.on { transform: none; }
  @media (min-width: 760px) { .sheet { left: 50%; width: 680px; margin-left: -340px; bottom: 12px; border-radius: 20px; max-height: calc(100dvh - 40px); } }
  .sh-h { padding: 8px 12px 10px; border-bottom: 1px solid var(--line); flex: none; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 8px; }
  .sh-top { display: flex; align-items: center; gap: 12px; }
  .sh-top .th { width: 44px; height: 44px; }
  .sh-t { flex: 1; min-width: 0; }
  .sh-t b { display: block; font-size: 17px; line-height: 1.25; }
  .sh-t span { color: var(--muted); font-size: 13.5px; }
  .x { appearance: none; border: 0; width: 44px; height: 44px; border-radius: 22px; background: var(--chip); color: var(--text); font-size: 20px; cursor: pointer; flex: none; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-top: 10px; background: var(--chip); padding: 3px; border-radius: 12px; }
  .tab { appearance: none; border: 0; background: transparent; color: var(--text); min-height: 44px; border-radius: 10px; font-weight: 650; font-size: 16px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .tab small { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .tab .pk { color: var(--good); }
  .sh-b { flex: 1; min-height: 0; overflow: hidden; display: flex; }
  .panes { flex: 1; min-height: 0; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .panes::-webkit-scrollbar { display: none; }
  .pane { flex: 0 0 100%; scroll-snap-align: start; overflow-y: auto; padding: 12px 14px 20px; overscroll-behavior: contain; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .badge { font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--chip); }
  .badge.rec { background: color-mix(in srgb, var(--warn-bg) 26%, transparent); }
  .badge.c-warn { background: color-mix(in srgb, var(--warn-bg) 24%, transparent); } .badge.c-good { background: color-mix(in srgb, var(--good-bg) 24%, transparent); }
  .badge.c-info { background: color-mix(in srgb, var(--info) 22%, transparent); } .badge.c-bad { background: color-mix(in srgb, var(--bad) 22%, transparent); }
  .badge.pkd { background: color-mix(in srgb, var(--good-bg) 26%, transparent); }
  .pane h3 { font-size: 21px; margin: 2px 0 10px; line-height: 1.25; }
  .facts { background: var(--card); border-radius: 14px; padding: 2px 12px; margin-bottom: 12px; }
  .fact { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
  .fact:first-child { border-top: 0; }
  .fact .k { color: var(--muted); width: 92px; flex: none; }
  .fact .v { flex: 1; min-width: 0; }
  .fact a { color: var(--accent); font-weight: 600; text-decoration: none; display: inline-block; padding: 6px 0; min-height: 44px; line-height: 32px; }
  .fact .note2 { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .hook { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 14px; border-left: 4px solid var(--warn-bg); }
  .hook .k, .beat .k { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
  .hook p { font-size: 18px; font-weight: 650; margin: 4px 0 6px; line-height: 1.35; }
  .ost { display: inline-block; background: #111; color: #fff; font-weight: 800; font-size: 12.5px; letter-spacing: .02em; padding: 3px 8px; border-radius: 6px; }
  @media (prefers-color-scheme: dark) { .ost { background: #f5f5f7; color: #111; } }
  .h4 { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 4px 2px 8px; }
  .beat { background: var(--card); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .beat .tm { font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 700; color: var(--accent); }
  .beat .vo { font-size: 16px; margin: 4px 0 8px; line-height: 1.4; }
  .beat .ac { font-size: 14px; color: var(--text); margin: 2px 0 6px; }
  details.more2 { background: var(--card); border-radius: 14px; padding: 0 12px; margin-top: 10px; }
  details.more2 summary { min-height: 48px; display: flex; align-items: center; font-weight: 650; cursor: pointer; }
  details.more2 p { margin: 0 0 12px; font-size: 15px; line-height: 1.45; }
  .sh-f { flex: none; padding: 10px 14px calc(12px + var(--safe-b)); border-top: 1px solid var(--line); background: var(--bg); }
  .sh-f .msg { font-size: 14px; color: var(--muted); text-align: center; margin-bottom: 8px; }
  .sh-f .msg.ok { color: var(--good); font-weight: 650; }
  .sh-f .row2 { display: flex; gap: 8px; }
  .sh-f .row2 > * { flex: 1; }
  .det { padding: 12px 14px 8px; }
  .det .facts { margin-bottom: 12px; }
  .det .acts { display: grid; gap: 8px; }
  .det .acts > * { width: 100%; min-height: 50px; font-size: 16px; }
  .nav { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-top: 10px; background: var(--chip); padding: 3px; border-radius: 14px; }
  .nav button { appearance: none; border: 0; background: transparent; color: var(--text); min-height: 44px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .nav button[aria-selected="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
  .nav .n { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 11px; line-height: 18px; }
  .nav .n.off { background: transparent; color: var(--muted); }
  .who { font-size: 17px; font-weight: 700; }
  .take { border-top: 1px solid var(--line); padding: 10px 6px; }
  .take:first-child { border-top: 0; }
  .take video { width: 100%; border-radius: 12px; background: #000; margin-top: 8px; }
  textarea.reason { width: 100%; min-height: 56px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: 16px/1.35 inherit; padding: 10px; margin-top: 8px; }
  .exp { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .exp.hot { color: var(--warn); font-weight: 650; }
</style>
</head>
<body>
<header><div class="top">
  <div class="hrow"><h1 id="title">Comando</h1><span class="meta" id="meta">Cargando…</span></div>
  <div class="nav" role="tablist">
    <button type="button" data-view="film" aria-selected="true">Grabar<span class="n off" id="nFilm"></span></button>
    <button type="button" data-view="creators" aria-selected="false">Creadoras<span class="n off" id="nCreators"></span></button>
    <button type="button" data-view="more" aria-selected="false">Más<span class="n off" id="nMore"></span></button>
  </div>
</div></header>
<main id="main"></main>
<div class="foot" id="foot"></div>
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden></div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button type="button" id="undo">Deshacer</button></div>
<script>
const $ = (id) => document.getElementById(id);
const TONES = new Set(["bad", "warn", "good", "info"]);

  "Elegir productos": "🛍️", "Decidir oferta": "🤝", "Enviar respuesta": "✉️", "Entregar": "📦", "Cerrado": "✅", "Negociando": "💬",
  "Email rebotó": "⚠️", "¿Llegó?": "📦", "Completar tomas": "🎥", "Pasar tomas a la Mac": "💻", "Armando pack": "🧩", "Armando el board": "🧩", "Editando": "✂️",
  "Escribiendo guiones": "📝", "Dar GO a las fotos": "🖼️", "Content gap": "🔎", "Identificando producto": "🔎", "Haciendo video": "🎞️" };

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function safeHttpsUrl(raw) {
  const text = String(raw ?? "").trim();
  if (!text || text.length > 4096 || /[\u0000-\u001F\u007F\u2028\u2029\\]/.test(text) || text.startsWith("//")) return "";
  let url;
  try { url = new URL(text, location.href); } catch (e) { return ""; }
  if (url.username || url.password) return "";

function secret() {
  const h = new URLSearchParams((location.hash || "").replace(/^#/, ""));

}
function apiBaseOk(raw) {

  } catch (e) {}

}
function b64urlToBytes(t) { const p = "=".repeat((4 - (t.length % 4)) % 4); const bin = atob(t.replace(/-/g, "+").replace(/_/g, "/") + p); return Uint8Array.from(bin, (c) => c.charCodeAt(0)); }
function b64ToBytes(t) { const bin = atob(t); return Uint8Array.from(bin, (c) => c.charCodeAt(0)); }
async function decryptScene(blob, keyText) {
  const key = await crypto.subtle.importKey("raw", b64urlToBytes(keyText), "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.ct));

// Local memory (per hub link) so taps show instantly on this device.
const DONE_TTL = 3 * 24 * 3600 * 1000, PICK_TTL = 7 * 24 * 3600 * 1000;
function storeKey(kind) { return "hub-" + kind + ":" + secret().b.replace(/[^a-z0-9]/gi, ""); }
function loadDone() {
  try {
    const raw = JSON.parse(localStorage.getItem(storeKey("done")) || "{}");
    const now = Date.now(); const out = {};
    for (const [k, v] of Object.entries(raw)) if (ID_RE.test(k) && typeof v === "number" && now - v < DONE_TTL) out[k] = v;
    return out;
  } catch (e) { return {}; }
}
function saveDone(map) { try { localStorage.setItem(storeKey("done"), JSON.stringify(map)); } catch (e) {} }
function loadPicks() {
  try {
    const raw = JSON.parse(localStorage.getItem(storeKey("picks")) || "{}");
    const now = Date.now(); const out = {};
    for (const [k, v] of Object.entries(raw)) {
      if (JOB_RE.test(k) && v && (LETTERS.includes(v.letter) || v.letter === "") && typeof v.at === "number" && now - v.at < PICK_TTL) out[k] = { letter: v.letter, at: v.at, sent: !!v.sent };
    }
    return out;
  } catch (e) { return {}; }
}
function savePicks(map) { try { localStorage.setItem(storeKey("picks"), JSON.stringify(map)); } catch (e) {} }

function mailboxId() {
  // Prefer the sealed scene mailbox (survives &f= rotations), fall back to the link's &f=.
  const fromScene = scene && FEEDBACK_UUID.test(String(scene.mailbox || "")) ? String(scene.mailbox).trim() : "";
  const fromUrl = String(secret().f || "").trim();
  return fromScene || (FEEDBACK_UUID.test(fromUrl) ? fromUrl : "");
}
async function sendFeedback(payload) {
  const box = mailboxId();
  if (!FEEDBACK_UUID.test(box)) throw new Error("sin buzón");
  const endpoint = new URL("https://webhook.site/" + box);
  if (endpoint.origin !== "https://webhook.site" || endpoint.pathname !== "/" + box) throw new Error("sin buzón");
  const body = JSON.stringify(Object.assign({ at: new Date().toISOString() }, payload));
  if (body.length > 60000) throw new Error("grande");
  const res = await fetch(endpoint.href, { method: "POST", headers: { "Content-Type": "application/json" }, body,
    redirect: "error", referrerPolicy: "no-referrer", credentials: "omit" });
  if (!res.ok) throw new Error(String(res.status));
}

async function mgrApi(path, opts) {
  const base = apiBaseOk(scene && (scene.portalApi || scene.apiBase));
  if (!base) throw new Error("api");
  const tok = secret().m;
  const headers = Object.assign({ "content-type": "application/json" }, (opts && opts.headers) || {});
  if (tok) headers.authorization = "Bearer " + tok;
  const res = await fetch(base + path, Object.assign({ referrerPolicy: "no-referrer", credentials: "omit" }, opts || {}, { headers }));
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch (e) { body = { error: text }; }
  if (!res.ok) { const err = new Error((body && body.message) || String(res.status)); err.status = res.status; throw err; }
  return body;
}

function previewUrlOk(raw, id) {

    const h = u.hostname.toLowerCase();
    if (!(h.endsWith(".workers.dev") || h === "localhost" || h === "127.0.0.1")) return "";
    if (!u.pathname.includes("/manager/takes/") || !u.pathname.endsWith("/file")) return "";
    if (id && !u.pathname.includes(encodeURIComponent(id)) && !u.pathname.includes(id)) return "";

function expiryLabel(iso) {

// Returns { sub, buttons } for an item's `mail` object, or null.
function mailHtml(m, quiet) {

  const web = safeMailWeb(m.web);
  const search = cleanText(m.search, 200);
  const subject = cleanText(m.subject, 120);
  const sub = subject ? `<div class="mailsub">✉︎ ${esc(subject)}</div>` : "";
  const cls = quiet ? "go ghost" : "go";
  let buttons = "";
  if (IS_IOS) {
    buttons = `<a class="${cls}" href="${GMAIL_IOS_APP}">Abrir Gmail</a>`;
  } else if (web) {

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) {}
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0"; ta.style.top = "0";
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  return ok;
}

// ---------- scene helpers ----------
function thumbSrc(ref) {
  const t = scene && scene.thumbs && typeof scene.thumbs === "object" ? scene.thumbs[String(ref || "")] : "";
  return typeof t === "string" && t.length < 60000 && THUMB_RE.test(t) ? t : "";
}
function thumbHtml(it) {
  const src = thumbSrc(it.thumb);
  if (src) return `<img class="th" alt="" src="${esc(src)}">`;
  return `<span class="th ic" aria-hidden="true">${esc(ICONS[it.verb] || (it.mail ? "✉️" : "•"))}</span>`;
}
function sheetFor(ref) {
  const r = String(ref || "");
  if (!JOB_RE.test(r) || !scene || !scene.scripts || typeof scene.scripts !== "object") return null;
  const sc = scene.scripts[r];
  if (!sc || !Array.isArray(sc.options)) return null;
  const opts = sc.options.filter((o) => o && LETTERS.includes(o.letter)).slice(0, 3);
  return opts.length ? { ref: r, sc, opts } : null;
}
function scriptRef(it) { return it && it.open && typeof it.open === "object" && sheetFor(it.open.scripts) ? String(it.open.scripts) : ""; }
// Effective pick: newest of this device's tap and the processed pick in the scene.
function pickOf(ref) {

  const srv = LETTERS.includes(s.sc.picked) ? s.sc.picked : "";

function actionsHtml(it, done, opts) {

  const href = !mail && it.href ? safeHttpsUrl(it.href) : "";

  }

function visibleItems(s, done) { return (Array.isArray(s.items) ? s.items : []).filter((it) => !done[it.id]); }

}

// One delegated click handler for page + sheet.
document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button, a, .it, .ctr");
  if (!t) return;
  if (t.matches("a")) return;
  if (t.dataset.view) { view = t.dataset.view; render(true); return; }
  if (t.dataset.q !== undefined) { const ok = await copyText(cleanText(t.dataset.q, 200)); toast(ok ? "Copiado. Ahora abre Gmail, toca Buscar y pega." : "No se pudo copiar."); return; }
  if (t.dataset.done) { markDone(t.dataset.done, t); return; }
  if (t.dataset.act) { markAct(t.dataset.act, t); return; }
  if (t.dataset.scripts) { openScripts(t.dataset.scripts); return; }
  if (t.dataset.open) { openDetail(t.dataset.open); return; }
  if (t.dataset.tab) { showTab(t.dataset.tab, true); return; }
  if (t.dataset.pick !== undefined) { pickScript(t.dataset.pick); return; }
  if (t.id === "shClose") { closeSheet(); return; }
  if (t.classList.contains("ctr")) { jumpTo(t.dataset.jump, Number(t.dataset.v), t.querySelector("span").textContent); return; }
  if (t.dataset.copy) {
    const p = creatorsList().find((x) => x.id === t.dataset.copy);
    const toastEl = t.closest("section") && t.closest("section").querySelector("[data-toast]");
    try { await navigator.clipboard.writeText(p && p.link ? p.link : ""); if (toastEl) toastEl.textContent = "Copiado"; toast("Copiado"); }
    catch (e) { if (toastEl) toastEl.textContent = "No se pudo"; }
    return;
  }
  if (t.dataset.extend) { creatorAct("extend", t.dataset.extend, t); return; }
  if (t.dataset.revoke) { creatorAct("revoke", t.dataset.revoke, t); return; }
  if (t.dataset.approve) { takeAct(t.dataset.approve, "approve"); return; }
  if (t.dataset.redo) {
    const area = $("main").querySelector(`[data-reason="${t.dataset.redo}"]`);
    if (area && area.hidden) { area.hidden = false; area.focus(); return; }
    takeAct(t.dataset.redo, "redo", area && area.value);
    return;
  }
  if (t.classList.contains("it") && t.dataset.id) { rowTap(t.dataset.id); }
});
async function creatorAct(kind, id, btn) {
  const toastEl = btn.closest("section") && btn.closest("section").querySelector("[data-toast]");
  try {
    await mgrApi(`/manager/sessions/${encodeURIComponent(id)}/${kind}`, { method: "POST", body: JSON.stringify(kind === "extend" ? { days: 3 } : {}) });
    if (toastEl) toastEl.textContent = kind === "revoke" ? "Revocado" : "Extendido";
    await refreshCreators(); render(true);
  } catch (e) { if (toastEl) toastEl.textContent = "No se pudo"; }
}
async function takeAct(id, kind, reason) {
  try {
    await mgrApi(`/manager/takes/${encodeURIComponent(id)}/${kind}`, { method: "POST", body: JSON.stringify(kind === "redo" ? { reason: cleanText(reason, 200) } : {}) });
    await refreshCreators(); render(true);
  } catch (e) { toast("No se pudo"); }
}
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && sheetState) closeSheet();
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.classList && ev.target.classList.contains("it")) { ev.preventDefault(); rowTap(ev.target.dataset.id); }
});
$("scrim").addEventListener("click", () => closeSheet());

function rowTap(id) {
  const it = itemById(id); if (!it) return;
  const ref = scriptRef(it);
  if (ref && !it.detail) return openScripts(ref);
  const href = !it.mail && it.href ? safeHttpsUrl(it.href) : "";
  if (href && !it.detail && !it.done && !it.act) { window.open(href, "_blank", "noopener,noreferrer"); return; }
  openDetail(id);
}
function jumpTo(jump, v, label) {
  if (!v) { toast("Nada " + label + " ✓"); return; }
  const [sec, grp] = String(jump || "").split(":");
  let el = grp ? document.querySelector(`.grp[data-grp="${CSS.escape(sec + ":" + grp)}"]`) : null;
  if (!el) el = document.querySelector(`section[data-sec="${CSS.escape(sec || "")}"]`);
  if (!el) return;
  el.scrollIntoView({ behavior: "smooth", block: "start" });
  const target = grp && el.nextElementSibling ? el.nextElementSibling : el.querySelector("h2") || el;
  target.classList.remove("flash"); void target.offsetWidth; target.classList.add("flash");
}

// ---------- sheets ----------
function openSheet(state) {
  sheetState = state;
  $("scrim").hidden = false; $("sheet").hidden = false;
  document.body.classList.add("lock");
  renderSheet();
  requestAnimationFrame(() => { $("scrim").classList.add("on"); $("sheet").classList.add("on"); });
}
function closeSheet() {
  sheetState = null;
  $("scrim").classList.remove("on"); $("sheet").classList.remove("on");
  document.body.classList.remove("lock");
  setTimeout(() => { if (!sheetState) { $("scrim").hidden = true; $("sheet").hidden = true; $("sheet").innerHTML = ""; } }, 260);
}
function openScripts(ref) {
  const s = sheetFor(ref); if (!s) return;
  const pk = pickOf(ref);
  const start = pk.letter || (LETTERS.includes(s.sc.recommended) ? s.sc.recommended : s.opts[0].letter);
  openSheet({ type: "scripts", ref, tab: start });
}
function openDetail(id) { if (itemById(id)) openSheet({ type: "detail", id }); }
function renderSheet() {
  const st = sheetState; if (!st) return;
  const el = $("sheet");
  if (st.type === "detail") {
    const it = itemById(st.id); if (!it) return closeSheet();
    const done = loadDone();
    const a = actionsHtml(it, done, { big: true });
    const facts = (Array.isArray(it.detail) ? it.detail : []).filter((r) => Array.isArray(r) && r.length >= 2)
      .slice(0, 8).map((r) => `<div class="fact"><span class="k">${esc(cleanText(r[0], 30))}</span><span class="v">${esc(cleanText(r[1], 200))}</span></div>`).join("");
    el.className = "sheet short" + (el.classList.contains("on") ? " on" : "");
    el.innerHTML = `<div class="sh-h"><div class="grab"></div><div class="sh-top">${thumbHtml(it)}<div class="sh-t"><b id="shTitle">${it.verb ? esc(it.verb) + " · " : ""}${esc(it.title || "")}</b><span>${esc(subText(it))}</span>${a.mail ? a.mail.sub : ""}</div><button class="x" id="shClose" type="button" aria-label="Cerrar">✕</button></div></div>
      <div class="det">${chipHtml(it) ? `<div class="badges">${chipHtml(it).replace("chip", "badge")}</div>` : ""}${facts ? `<div class="facts">${facts}</div>` : ""}<div class="acts">${a.html || `<button class="ghost" type="button" id="shClose2">Cerrar</button>`}</div></div>`;
    const c2 = $("shClose2"); if (c2) c2.addEventListener("click", closeSheet);
    return;
  }
  const s = sheetFor(st.ref); if (!s) return closeSheet();
  const pk = pickOf(st.ref);
  const rec = LETTERS.includes(s.sc.recommended) ? s.sc.recommended : "";
  const thumb = thumbSrc(s.sc.thumb);
  const keepScroll = el.querySelector(".panes") ? el.querySelector(".panes").scrollLeft : null;
  const paneScroll = [...el.querySelectorAll(".pane")].map((p) => p.scrollTop);
  el.className = "sheet" + (el.classList.contains("on") ? " on" : "");
  const tabs = s.opts.map((o) => `<button class="tab" type="button" role="tab" data-tab="${o.letter}" aria-selected="${o.letter === st.tab}">${o.letter}${o.letter === pk.letter ? ` <small class="pk">✓</small>` : o.letter === rec ? " <small>★</small>" : ""}</button>`).join("");
  el.innerHTML = `<div class="sh-h"><div class="grab"></div><div class="sh-top">${thumb ? `<img class="th" alt="" src="${esc(thumb)}">` : `<span class="th ic">✍️</span>`}<div class="sh-t"><b id="shTitle">${esc(cleanText(s.sc.product, 60) || "Guiones")}</b><span>${pk.letter ? `Elegiste ${esc(pk.letter)}${pk.local ? " · preparando el board" : " · Grok arma el board"}` : `Elige 1 de ${s.opts.length} guiones`}</span></div><button class="x" id="shClose" type="button" aria-label="Cerrar">✕</button></div><div class="tabs" role="tablist">${tabs}</div></div>
    <div class="sh-b"><div class="panes" id="panes">${s.opts.map((o) => paneHtml(o, s, pk, rec)).join("")}</div></div>
    <div class="sh-f" id="shFoot">${footHtml(s, pk, st.tab)}</div>`;
  const panes = $("panes");
  const idx = Math.max(0, s.opts.findIndex((o) => o.letter === st.tab));
  [...el.querySelectorAll(".pane")].forEach((p, i) => { if (paneScroll[i]) p.scrollTop = paneScroll[i]; });
  panes.scrollLeft = keepScroll !== null ? keepScroll : idx * panes.clientWidth;
  let raf = 0;
  panes.addEventListener("scroll", () => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const i = Math.round(panes.scrollLeft / Math.max(1, panes.clientWidth));
      const o = s.opts[Math.min(s.opts.length - 1, Math.max(0, i))];
      if (o && o.letter !== sheetState.tab) showTab(o.letter, false);
    });
  }, { passive: true });
}
function showTab(letter, scroll) {
  if (!sheetState || sheetState.type !== "scripts" || !LETTERS.includes(letter)) return;
  const s = sheetFor(sheetState.ref); if (!s) return;
  sheetState.tab = letter;
  document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === letter)));
  if (scroll) { const panes = $("panes"); const i = s.opts.findIndex((o) => o.letter === letter); panes.scrollTo({ left: i * panes.clientWidth, behavior: "smooth" }); }
  $("shFoot").innerHTML = footHtml(s, pickOf(sheetState.ref), letter);
}
function fmtT(t) { return cleanText(t, 20).replace(/(^|-)0(\d:)/g, "$1$2").replace("-", "–"); }
function paneHtml(o, s, pk, rec) {
  const T = (v, n) => esc(cleanText(v, n || 600));
  const badges = (o.letter === rec ? `<span class="badge rec">★ Recomendado${s.sc.recommendedWhy ? " · " + T(s.sc.recommendedWhy, 80) : ""}</span>` : "") +
    (o.letter === pk.letter ? `<span class="badge pkd">✓ Elegido</span>` : "");
  const donorUrl = o.donor && DONOR_RE.test(String(o.donor.url || "")) ? String(o.donor.url) : "";
  const handle = o.donor ? cleanText(o.donor.handle, 40).replace(/[^A-Za-z0-9._]/g, "") : "";
  const transfer = donorUrl
    ? `Como en el video de referencia${handle ? " · @" + esc(handle) : ""}<br><a href="${esc(donorUrl)}" target="_blank" rel="noopener noreferrer">Ver video de referencia ↗</a>${o.transfer ? `<span class="note2">${T(o.transfer, 160)}</span>` : ""}`
    : (o.fill ? T(o.fill, 160) : "Estructura propia");
  const facts = [
    ["Formato", o.frameworkEs || o.framework], ["Como", null], ["Quién sale", o.cast], ["Dónde", o.place],
    ["Duración", Number(o.seconds) > 0 ? `~${Math.round(Number(o.seconds))} s` : ""],
  ].map(([k, v]) => k === "Como" ? `<div class="fact"><span class="k">${k}</span><span class="v">${transfer}</span></div>`
    : v ? `<div class="fact"><span class="k">${k}</span><span class="v">${T(v, 200)}</span></div>` : "").join("");
  const beats = (Array.isArray(o.beats) ? o.beats : []).slice(0, 30).map((b) => `<div class="beat"><div class="tm">${esc(fmtT(b.t))}</div><div class="vo">${T(b.vo)}</div>${b.visual ? `<div class="k">Qué haces</div><div class="ac">${T(b.visual, 300)}</div>` : ""}${b.text ? `<span class="ost">${T(b.text, 80)}</span>` : ""}</div>`).join("");
  return `<div class="pane" data-letter="${o.letter}">${badges ? `<div class="badges">${badges}</div>` : ""}<h3>Guion ${o.letter}${o.focus ? " · " + T(o.focus, 80) : ""}</h3>
    <div class="hook"><div class="k">Gancho (primeros segundos)</div><p>${T(o.hook, 400)}</p>${o.hookText ? `<span class="ost">${T(o.hookText, 80)}</span>` : ""}</div>
    <div class="facts">${facts}</div>
    <div class="h4">Segundo a segundo</div>${beats}
    ${o.teleprompter ? `<details class="more2"><summary>Todo el texto</summary><p>${T(o.teleprompter, 3000)}</p></details>` : ""}
    ${o.rules ? `<details class="more2"><summary>Reglas de este guion</summary><p>${T(o.rules, 400)}</p></details>` : ""}</div>`;
}
function footHtml(s, pk, tab) {
  if (s.sc.changeable === false) return `<div class="msg ok">El board ya está listo con el guion ${esc(pk.letter || s.sc.picked || "")}.</div>`;
  if (pk.letter && pk.letter === tab) {
    return `<div class="msg ok">Elegiste ${esc(tab)} · ${pk.local ? (pk.sent ? "preparando el board" : "enviando…") : "Grok arma el board"}</div><div class="row2"><button class="ghost" type="button" data-pick="">Quitar elección</button><button class="go" type="button" id="shClose">Listo</button></div>`;
  }
  const label = pk.letter ? `Cambiar a guion ${esc(tab)}` : `Elegir este guion (${esc(tab)})`;
  return `${pk.letter ? `<div class="msg">Ahora tienes el ${esc(pk.letter)}. Puedes cambiar hasta que Grok arme el board.</div>` : ""}<button class="go big" type="button" data-pick="${esc(tab)}">${label}</button>`;
}

// ---------- taps ----------
function pickScript(letter) {
  if (!sheetState || sheetState.type !== "scripts") return;
  const ref = sheetState.ref;
  if (!JOB_RE.test(ref) || !(LETTERS.includes(letter) || letter === "")) return;
  const prev = pickOf(ref).letter;
  const map = loadPicks(); map[ref] = { letter, at: Date.now(), sent: false }; savePicks(map);
  render(true);
  sendPick(ref, letter, map[ref].at);
  if (letter) toast(`Elegiste ${letter} · preparando el board`, () => pickUndo(ref, prev));
  else toast("Elección quitada", () => pickUndo(ref, prev));
}
function pickUndo(ref, prev) {
  const map = loadPicks(); map[ref] = { letter: prev || "", at: Date.now(), sent: false }; savePicks(map);
  sendPick(ref, prev || "", map[ref].at); render(true);
}
function sendPick(ref, letter, at) {
  sendFeedback({ kind: "pick", v: 1, job: ref, letter, at: new Date(at).toISOString() }).then(() => {
    const m = loadPicks(); if (m[ref] && m[ref].at === at) { m[ref].sent = true; savePicks(m); render(true); }
  }).catch(() => { toast("Sin conexión: tu elección se envía al volver a abrir."); });
}
function resendPicks() {
  const m = loadPicks();
  for (const [ref, v] of Object.entries(m)) if (!v.sent) sendPick(ref, v.letter, v.at);
}

function toast(msg, onUndo) {
  $("toastMsg").textContent = msg;
  undoFn = onUndo || null;
  $("undo").hidden = !onUndo;
  $("toast").classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").classList.remove("on"); undoFn = null; }, 6000);
}
$("undo").addEventListener("click", (ev) => { ev.stopPropagation(); if (undoFn) undoFn(); $("toast").classList.remove("on"); });

function markDone(id, btn) {
  if (!ID_RE.test(id)) return;
  const row = document.querySelector(`.it[data-id="${CSS.escape(id)}"]`);
  if (row) row.classList.add("gone");
  if (sheetState) closeSheet();
  const map = loadDone(); map[id] = Date.now(); saveDone(map);
  setTimeout(() => render(true), 260);
  sendFeedback({ kind: "approve", blockId: id, choice: "done" }).catch(() => {});
  toast("Listo ✓", () => {
    const m = loadDone(); delete m[id]; saveDone(m); render(true);
    sendFeedback({ kind: "approve", blockId: id, choice: "undo" }).catch(() => {});
  });
}
// Action buttons (Llegó, Pedí muestra…) keep the row; they only record the tap.
function markAct(id, btn) {
  if (!ID_RE.test(id) || btn.disabled) return;
  btn.disabled = true;
  const map = loadDone(); map[id] = Date.now(); saveDone(map);
  sendFeedback({ kind: "approve", blockId: id, choice: "done" }).catch(() => {});
  render(true);
  toast("Anotado ✓", () => {
    const m = loadDone(); delete m[id]; saveDone(m); render(true);
    sendFeedback({ kind: "approve", blockId: id, choice: "undo" }).catch(() => {});
  });
}

async function load() {
  const sec = secret();
  if (!sec.b || !sec.k) {
    $("meta").textContent = "";
    $("main").innerHTML = `<p class="status">Este enlace está incompleto. Pídele a Grok el enlace completo.</p>`;
    return;
  }
  const okHost = location.hostname.endsWith("github.io") || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if (!okHost) { $("main").innerHTML = `<p class="status">Abre este enlace desde __CANVAS_HOST__.</p>`; return; }
  const id = sec.b.replace(/[^a-zA-Z0-9_-]/g, "");
  try {
    const res = await fetch(`scenes/${id}.json?t=${Date.now()}`, { cache: "no-store", referrerPolicy: "no-referrer" });
    if (!res.ok) throw new Error(String(res.status));
    const next = await decryptScene(await res.json(), sec.k);
    if (!next || (next.type !== "hub" && next.type !== "comando")) throw new Error("type");
    const first = !scene;
    scene = next;
    const active = document.activeElement;
    if (active && active.id === "note" && active.value) return;
    await refreshCreators();
    if (first) {
      const done = loadDone();
      const films = filmItems(done).length;
      const cre = creatorActionCount();
      view = films ? "film" : (cre ? "creators" : "film");
    }
    render(false);
  } catch (e) {
    if (scene) return;
    $("meta").textContent = "";
    $("main").innerHTML = `<p class="status">No se pudo abrir. La llave no coincide o todavía se está publicando.</p>`;
  }
}
load().then(resendPicks);
setInterval(load, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { load(); resendPicks(); refreshCreators().then(() => render(true)).catch(() => {}); } });
</script>
