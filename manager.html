<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob: https://cdn.jsdelivr.net; media-src 'self' blob: https://cdn.jsdelivr.net https://*.workers.dev; connect-src 'self' https://cdn.jsdelivr.net https://*.workers.dev https://*.r2.cloudflarestorage.com; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">
<meta name="theme-color" content="#f2f2f7">
<title>Manager</title>
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --text: #1c1c1e; --muted: #6e6e73; --line: rgba(60,60,67,.14);
    --accent: #007aff; --chip: #e9e9ee; --bad: #ff3b30; --good: #34c759; --warn: #ff9500; --info: #007aff;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --line: rgba(255,255,255,.10); --accent: #0a84ff; --chip: #2c2c2e; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 3; padding: calc(10px + var(--safe-t)) 16px 10px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px); border-bottom: 1px solid var(--line); }
  .top, main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; }
  .meta { font-size: 12.5px; color: var(--muted); }
  .hrow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  main { padding: 12px 12px calc(28px + var(--safe-b)); }
  article { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .nm { font-size: 17px; font-weight: 700; }
  .sub { font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--chip); }
  .st { color: #fff; }
  .st.bad { background: var(--bad); } .st.good { background: var(--good); } .st.info { background: var(--info); } .st.warn { background: var(--warn); }
  .act { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button.btn { min-height: 44px; padding: 0 14px; border-radius: 11px; background: var(--accent); color: #fff; border: 0;
    font: 600 15px/44px -apple-system, sans-serif; cursor: pointer; }
  button.ghost { background: var(--chip); color: var(--text); }
  button.bad { background: var(--bad); }
  .status { color: var(--muted); padding: 30px 16px; text-align: center; }
  video { width: 100%; border-radius: 12px; background: #000; margin-top: 8px; }
  .take { border-top: 1px solid var(--line); padding: 10px 0; }
  .take:first-child { border-top: 0; }
  textarea { width: 100%; min-height: 64px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: 16px/1.35 inherit; padding: 10px; margin-top: 8px; }
  .toast { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 18px; }
</style>
</head>
<body>
<header><div class="top"><div class="hrow"><h1>Portales</h1><span class="meta" id="meta"></span></div></div></header>
<main id="main"><p class="status">Cargando…</p></main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const LABELS = { sent: "Enviado", opened: "Abierto", uploading: "Subiendo", uploaded: "Subido", approved: "Aprobado", redo: "Re-grabar", pulled: "En Mac" };
const TONES = { sent: "info", opened: "info", uploading: "warn", uploaded: "info", approved: "good", redo: "warn", pulled: "good" };
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function txt(s, max) { return String(s ?? "").replace(/[\u0000-\u001F\u007F\u2028\u2029]/g, " ").replace(/\s+/g, " ").trim().slice(0, max || 160); }
function secret() { const h = new URLSearchParams((location.hash || "").replace(/^#/, "")); return { b: h.get("b") || "", k: h.get("k") || "", m: h.get("m") || "" }; }
function b64urlToBytes(t) { const p = "=".repeat((4 - (t.length % 4)) % 4); const bin = atob(t.replace(/-/g, "+").replace(/_/g, "/") + p); return Uint8Array.from(bin, (c) => c.charCodeAt(0)); }
function b64ToBytes(t) { const bin = atob(t); return Uint8Array.from(bin, (c) => c.charCodeAt(0)); }
async function decryptScene(blob, keyText) {
  const key = await crypto.subtle.importKey("raw", b64urlToBytes(keyText), "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function apiBaseOk(raw) {
  try {
    const u = new URL(String(raw || ""));
    if (u.protocol !== "https:" || u.username || u.password) return "";
    const h = u.hostname.toLowerCase();
    if (h.endsWith(".workers.dev") || h === "localhost" || h === "127.0.0.1") return u.origin;
  } catch (e) {}
  return "";
}
let scene = null, live = [];

async function api(path, opts) {
  const base = apiBaseOk(scene && scene.apiBase);
  if (!base) throw new Error("api");
  const tok = secret().m;
  const headers = Object.assign({ "content-type": "application/json" }, (opts && opts.headers) || {});
  if (tok) headers.authorization = "Bearer " + tok;
  const res = await fetch(base + path, Object.assign({ referrerPolicy: "no-referrer", credentials: "omit" }, opts || {}, { headers }));
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch (e) { body = { error: text }; }
  if (!res.ok) { const err = new Error((body && body.message) || String(res.status)); err.status = res.status; throw err; }
  return body;
}

async function refresh() {
  if (!apiBaseOk(scene && scene.apiBase) || !secret().m) return;
  const data = await api("/manager/sessions");
  live = data.sessions || [];
}

function sessionOf(id) { return live.find((s) => s.id === id) || null; }

function portalHtml(p) {
  const liveS = sessionOf(p.id);
  const jobs = (liveS && liveS.jobs) || p.jobs || [];
  const creator = txt(p.creatorName || (liveS && liveS.creator_name), 40) || "Creadora";
  const date = txt(p.shootDate || (liveS && liveS.shoot_date), 16);
  const revoked = liveS && liveS.revoked_at;
  const pills = jobs.map((j) => {
    const st = j.status || "sent";
    return `<span class="tag st ${esc(TONES[st] || "info")}">${esc(txt(j.name || j.job_id, 24))} · ${esc(LABELS[st] || st)}</span>`;
  }).join("");
  const takes = ((liveS && liveS.takes) || []).map((t) => {
    return `<div class="take" data-take="${esc(t.id)}"><div class="nm">Shot ${String(t.shot).padStart(2,"0")} take ${t.take} · ${esc(LABELS[t.status] || t.status)}</div>
      ${t.redo_reason ? `<div class="sub">${esc(txt(t.redo_reason, 200))}</div>` : ""}
      <video controls playsinline preload="metadata" data-vid="${esc(t.id)}"></video>
      <div class="act"><button type="button" class="btn" data-approve="${esc(t.id)}">Aprobar</button>
      <button type="button" class="btn ghost" data-redo="${esc(t.id)}">Re-grabar</button></div>
      <textarea data-reason="${esc(t.id)}" placeholder="Motivo de re-grabar" hidden></textarea></div>`;
  }).join("");
  return `<article data-portal="${esc(p.id)}"><div class="nm">${esc(creator)}</div>
    <div class="sub">${esc(date)}${revoked ? " · revocado" : ""}</div>
    <div class="tags">${pills}</div>
    <div class="act">
      <button type="button" class="btn" data-copy="${esc(p.id)}">Copiar link</button>
      <button type="button" class="btn ghost" data-extend="${esc(p.id)}">Extender</button>
      <button type="button" class="btn bad" data-revoke="${esc(p.id)}">Revocar</button>
    </div>
    <p class="toast" data-toast></p>
    ${takes ? `<div class="takes">${takes}</div>` : ""}</article>`;
}

function render() {
  const portals = scene.portals || [];
  $("meta").textContent = portals.length + " portales";
  $("main").innerHTML = portals.length ? portals.map(portalHtml).join("") : `<p class="status">Sin portales.</p>`;
  $("main").querySelectorAll("[data-copy]").forEach((b) => b.addEventListener("click", async () => {
    const p = (scene.portals || []).find((x) => x.id === b.dataset.copy);
    const toast = b.closest("article").querySelector("[data-toast]");
    try { await navigator.clipboard.writeText(p && p.link ? p.link : ""); toast.textContent = "Link copiado"; }
    catch (e) { toast.textContent = "No se pudo copiar"; }
  }));
  $("main").querySelectorAll("[data-revoke]").forEach((b) => b.addEventListener("click", () => act("revoke", b.dataset.revoke, b)));
  $("main").querySelectorAll("[data-extend]").forEach((b) => b.addEventListener("click", () => act("extend", b.dataset.extend, b)));
  $("main").querySelectorAll("[data-approve]").forEach((b) => b.addEventListener("click", () => takeAct(b.dataset.approve, "approve")));
  $("main").querySelectorAll("[data-redo]").forEach((b) => b.addEventListener("click", () => {
    const area = $("main").querySelector(`[data-reason="${b.dataset.redo}"]`);
    if (area.hidden) { area.hidden = false; area.focus(); return; }
    takeAct(b.dataset.redo, "redo", area.value);
  }));
  $("main").querySelectorAll("[data-vid]").forEach((v) => loadPreview(v));
}

async function act(kind, id, btn) {
  const toast = btn.closest("article").querySelector("[data-toast]");
  try {
    await api(`/manager/sessions/${encodeURIComponent(id)}/${kind}`, { method: "POST", body: JSON.stringify(kind === "extend" ? { days: 3 } : {}) });
    toast.textContent = kind === "revoke" ? "Revocado" : "Extendido 3 días";
    await refresh(); render();
  } catch (e) { toast.textContent = "No se pudo"; }
}

async function takeAct(id, kind, reason) {
  try {
    await api(`/manager/takes/${encodeURIComponent(id)}/${kind}`, { method: "POST", body: JSON.stringify(kind === "redo" ? { reason: txt(reason, 200) } : {}) });
    await refresh(); render();
  } catch (e) {}
}

function previewUrlOk(raw, id) {
  try {
    const u = new URL(String(raw || ""));
    if (u.protocol !== "https:" || u.username || u.password) return "";
    const h = u.hostname.toLowerCase();
    if (!(h.endsWith(".workers.dev") || h === "localhost" || h === "127.0.0.1")) return "";
    if (!u.pathname.includes("/manager/takes/") || !u.pathname.endsWith("/file")) return "";
    if (id && !u.pathname.includes(encodeURIComponent(id)) && !u.pathname.includes(id)) return "";
    if (!u.searchParams.get("ticket")) return "";
    return u.href;
  } catch (e) {}
  return "";
}

async function loadPreview(el) {
  try {
    const data = await api(`/manager/takes/${encodeURIComponent(el.dataset.vid)}/url`);
    const href = previewUrlOk(data && data.url, el.dataset.vid);
    if (href) el.src = href;
  } catch (e) {}
}

async function load() {
  const sec = secret();
  if (!sec.b || !sec.k) { $("main").innerHTML = `<p class="status">Este enlace está incompleto.</p>`; return; }
  const okHost = location.hostname.endsWith("github.io") || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if (!okHost) { $("main").innerHTML = `<p class="status">Abre este enlace desde GitHub Pages.</p>`; return; }
  try {
    const res = await fetch(`scenes/${sec.b.replace(/[^a-zA-Z0-9_-]/g, "")}.json?t=${Date.now()}`, { cache: "no-store", referrerPolicy: "no-referrer" });
    if (!res.ok) throw new Error("http");
    const next = await decryptScene(await res.json(), sec.k);
    if (!next || next.type !== "manager") throw new Error("type");
    scene = {
      type: "manager", apiBase: apiBaseOk(next.apiBase),
      portals: (Array.isArray(next.portals) ? next.portals : []).slice(0, 40).map((p) => ({
        id: txt(p.id, 40), creatorName: txt(p.creatorName, 40), shootDate: txt(p.shootDate, 16),
        link: String(p.link || "").slice(0, 2048),
        jobs: (Array.isArray(p.jobs) ? p.jobs : []).slice(0, 40).map((j) => ({ job_id: txt(j.job_id || j.id, 16), name: txt(j.name, 40), status: txt(j.status, 16) }))
      }))
    };
    try { await refresh(); } catch (e) {}
    render();
  } catch (e) {
    $("main").innerHTML = `<p class="status">No se pudo abrir.</p>`;
  }
}
load();
document.addEventListener("visibilitychange", () => { if (!document.hidden && scene) refresh().then(render).catch(() => {}); });
</script>
</body>
</html>
