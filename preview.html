<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">
<meta name="theme-color" content="#f2f2f7">
<title>Comando · vista previa</title>
<style>
  :root { color-scheme: light dark; --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#6e6e73; --line:rgba(60,60,67,.14);
    --accent:#007aff; --chip:#e9e9ee; --good:#34c759; --warn:#ff9500; --bad:#ff3b30;
    --say:#e8f3ff; --say-line:#8ec0ff;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --text:#f5f5f7; --muted:#98989d; --line:rgba(255,255,255,.1); --accent:#0a84ff; --chip:#2c2c2e;
    --say:#16324d; --say-line:#0a84ff; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 3; padding: calc(10px + var(--safe-t)) 16px 10px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
  .top, main { max-width: 430px; margin: 0 auto; }
  .hrow { display: flex; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; }
  .meta { font-size: 12.5px; color: var(--muted); }
  .nav { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-top: 10px; background: var(--chip); padding: 3px; border-radius: 14px; }
  .nav button { border: 0; background: transparent; min-height: 44px; border-radius: 12px; font: 700 14px/1 inherit; }
  .nav button[aria-selected="true"] { background: var(--card); }
  .n { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 11px; line-height: 18px; }
  main { padding: 12px 12px calc(28px + var(--safe-b)); }
  section, article { background: var(--card); border-radius: 18px; padding: 10px 10px 8px; margin-bottom: 12px; }
  h2 { font-size: 17px; margin: 4px 6px 8px; display: flex; justify-content: space-between; }
  h2 i { font-style: normal; color: var(--muted); font-weight: 500; font-size: 14px; }
  .it { display: flex; align-items: center; gap: 12px; padding: 10px 6px; min-height: 64px; border-top: 1px solid var(--line); }
  .it:first-of-type, h2 + .it { border-top: 0; }
  .th { width: 48px; height: 48px; border-radius: 12px; background: var(--chip); display: grid; place-items: center; font-size: 22px; flex: none; }
  .tx { flex: 1; min-width: 0; }
  .ln { font-size: 16px; } .ln b { font-weight: 650; }
  .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .go, .ghost { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 0; font: 600 15px inherit; }
  .go { background: var(--accent); color: #fff; }
  .ghost { background: var(--chip); color: var(--text); }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 650; background: var(--chip); margin: 4px 4px 0 0; }
  .chip.good { background: color-mix(in srgb, var(--good) 24%, transparent); }
  .chip.warn { background: color-mix(in srgb, var(--warn) 24%, transparent); }
  .bt { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 6px 10px; }
  .scene { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ph { aspect-ratio: 9/16; border-radius: 12px; background: linear-gradient(#d7d7dc, #bbb); }
  .say { margin: 10px 0 8px; padding: 14px; border-radius: 14px; background: var(--say); border: 1px solid var(--say-line); }
  .say .k, .do .k { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
  .say .k { color: var(--accent); }
  .say .q { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3; letter-spacing: -.02em; color: var(--text); }
  .do { margin-top: 4px; }
  .do .k { color: var(--muted); margin-bottom: 4px; }
  .do .d { font-size: 13.5px; font-weight: 400; line-height: 1.4; color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  .banner { font-size: 12px; color: var(--muted); text-align: center; padding: 8px; }
</style>
</head>
<body>
<header><div class="top">
  <div class="hrow"><h1>Comando</h1><span class="meta">vista previa</span></div>
  <div class="nav">
    <button type="button" data-view="film" aria-selected="true">Grabar<span class="n">2</span></button>
    <button type="button" data-view="creators" aria-selected="false">Creadoras<span class="n">1</span></button>
    <button type="button" data-view="board" aria-selected="false">Board</button>
  </div>
</div></header>
<main id="main"></main>
<p class="banner">Demo. El hub en vivo no cambia.</p>
<script>
const $ = (id) => document.getElementById(id);
const views = {
  film: `<section><h2>Mi grabación<i>2</i></h2>
    <div class="it"><span class="th">🎬</span><div class="tx"><div class="ln"><b>Grabar</b> · Toplux</div><div class="sub">Baño · 6 tomas</div></div><button class="go">Abrir</button></div>
    <div class="it"><span class="th">🎬</span><div class="tx"><div class="ln"><b>Grabar</b> · Cortina</div><div class="sub">Sala · 4 tomas</div></div><button class="go">Abrir</button></div>
  </section>`,
  creators: `<section><h2>Ana<i>1</i></h2>
    <div class="it" style="cursor:default"><div class="tx"><div class="sub">11 oct · vence en 2 días</div>
    <span class="chip warn">Sérum · Subido</span></div></div>
    <div class="bt"><button class="go">Copiar link</button><button class="ghost">Extender</button><button class="ghost">Revocar</button></div>
    <div class="it"><div class="tx"><div class="ln"><b>Escena 01</b> · Subido</div></div></div>
    <div class="bt"><button class="go">Aprobar</button><button class="ghost">Re-grabar</button></div>
  </section>
  <section><h2>Camila</h2>
    <div class="it" style="cursor:default"><div class="tx"><div class="sub">18 oct</div><span class="chip">Crema · Enviado</span></div></div>
    <div class="bt"><button class="go">Copiar link</button><button class="ghost">Extender</button><button class="ghost">Revocar</button></div>
  </section>`,
  board: `<article><h2>Video de referencia</h2><div class="ph"></div></article>
    <article><h2>Escenas</h2>
      <div class="scene"><div><div class="ph"></div><div class="sub">Referencia</div></div><div><div class="ph"></div><div class="sub">La nuestra</div></div></div>
      <div class="say"><div class="k">Lo que dices</div><blockquote class="q">Mira esto</blockquote></div>
      <div class="do"><div class="k">Qué haces</div><div class="d">Abre el pomo con la mano derecha.</div></div>
    </article>
    <article><h2>Guion</h2><p>Abre el pomo y enseña la etiqueta.</p><div class="bt"><button class="go">Copiar guion</button></div></article>
    <article><h2>Subida</h2><p class="hint">Graba en 1080p</p>
      <div class="it" style="flex-direction:column;align-items:stretch;gap:8px">
        <div class="ln"><b>Escena 01 · take 1</b></div>
        <div class="sub">Enviado</div>
        <button class="go" style="width:100%">Subir video</button>
      </div></article>`
};
function show(v) {
  $("main").innerHTML = views[v];
  document.querySelectorAll(".nav button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === v)));
}
document.querySelector(".nav").addEventListener("click", (ev) => {
  const b = ev.target.closest("button"); if (b) show(b.dataset.view);
});
show("film");
</script>
</body>
</html>
