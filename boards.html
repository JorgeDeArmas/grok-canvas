<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">
<meta name="theme-color" content="#f2f2f7">
<title>Todos los boards</title>
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --text: #1c1c1e; --muted: #6e6e73; --line: rgba(60,60,67,.14);
    --accent: #007aff; --chip: #e9e9ee; --bad: #ff3b30; --good: #34c759; --warn: #ff9500; --info: #007aff; --teal: #30b0c7; --purple: #af52de;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --line: rgba(255,255,255,.10); --accent: #0a84ff; --chip: #2c2c2e; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 3; padding: calc(10px + var(--safe-t)) 16px 10px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px); border-bottom: 1px solid var(--line); }
  .top, main { max-width: 760px; margin: 0 auto; }
  .hrow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; }
  .meta { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--chip); border-radius: 10px; padding: 2px; margin-top: 10px; }
  .seg button { border: 0; background: transparent; color: var(--text); border-radius: 8px; min-height: 36px; font: 600 14.5px -apple-system, "Segoe UI", sans-serif; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .seg button i, .chips button i { font-style: normal; color: var(--muted); font-weight: 500; margin-left: 4px; }
  .chips { display: flex; gap: 8px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; min-height: 36px; padding: 0 14px;
    font: 600 14px -apple-system, "Segoe UI", sans-serif; cursor: pointer; }
  .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chips button[aria-pressed="true"] i { color: rgba(255,255,255,.8); }
  main { padding: 12px 12px calc(28px + var(--safe-b)); }
  .list { background: var(--card); border-radius: 16px; overflow: hidden; }
  .card { display: flex; gap: 12px; padding: 12px; border-top: 1px solid var(--line); align-items: flex-start; }
  .card:first-child { border-top: 0; }
  .card img, .card .ph { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--chip); flex: none; }
  .body { flex: 1; min-width: 0; }
  .nm { font-size: 16.5px; font-weight: 700; }
  .what { font-size: 14px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  .tag { font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--text); }
  .st { color: #fff; }
  .st.bad { background: var(--bad); } .st.good { background: var(--good); } .st.info { background: var(--info); }
  .st.teal { background: var(--teal); } .st.warn { background: var(--warn); } .st.purple { background: var(--purple); } .st.muted { background: var(--muted); }
  .when { font-size: 12.5px; color: var(--muted); }
  .note { margin-top: 7px; font-size: 13.5px; border-radius: 10px; padding: 7px 9px; background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--text); }
  .note.soft { background: var(--chip); color: var(--muted); }
  .note b { color: var(--bad); }
  .act { margin-top: 9px; }
  a.btn { display: inline-block; min-height: 44px; padding: 0 16px; border-radius: 11px; background: var(--accent); color: #fff; text-decoration: none;
    font: 600 15px/44px -apple-system, "Segoe UI", sans-serif; white-space: nowrap; }
  .nolink { font-size: 13.5px; color: var(--muted); line-height: 1.3; display: inline-block; padding: 6px 0; }
  .empty { background: var(--card); border-radius: 16px; padding: 22px 16px; text-align: center; color: var(--muted); }
  .foot { color: var(--muted); font-size: 13px; padding: 14px 6px 0; }
  .foot p { margin: 0 0 6px; }
  .status { color: var(--muted); padding: 30px 16px; text-align: center; }
</style>
</head>
<body>
<header><div class="top">
  <div class="hrow"><h1>Todos los boards</h1><span class="meta" id="meta"></span></div>
  <div class="seg" role="group" aria-label="Avatar" id="seg"></div>
  <div class="chips" role="group" aria-label="Tipo" id="chips"></div>
</div></header>
<main id="main"><p class="status">Cargando…</p></main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const THUMB_RE = /^data:image\/jpeg;base64,[A-Za-z0-9+/]+={0,2}$/;
const DATE_RE = /^\d{4}-\d{2}-\d{2}/;
const AVATARS = [["all", "Todos"], ["miamix", "Miami X"], ["bella", "Bella"]];
const TONES = new Set(["bad", "good", "info", "teal", "warn", "purple", "muted"]);
const MONTHS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function txt(s, max) { return String(s ?? "").replace(/[\u0000-\u001F\u007F\u2028\u2029]/g, " ").replace(/\s+/g, " ").trim().slice(0, max || 120); }
function boardUrl(raw) {
  // only boards on this canvas site (same host + path); anything else is dropped
  const t = String(raw ?? "").trim();
  if (!t || t.length > 2048 || /[\u0000-\u001F\u007F\\\s]/.test(t)) return "";
  let u; try { u = new URL(t); } catch (e) { return ""; }
  if (u.protocol !== "https:" || u.username || u.password || u.hostname !== "jorgedearmas.github.io" || !u.pathname.startsWith("/grok-canvas/")) return "";
  return u.href;
}
function secret() { const h = new URLSearchParams((location.hash || "").replace(/^#/, "")); return { b: h.get("b") || "", k: h.get("k") || "" }; }
function b64urlToBytes(t) { const p = "=".repeat((4 - (t.length % 4)) % 4); const bin = atob(t.replace(/-/g, "+").replace(/_/g, "/") + p); return Uint8Array.from(bin, (c) => c.charCodeAt(0)); }
function b64ToBytes(t) { const bin = atob(t); return Uint8Array.from(bin, (c) => c.charCodeAt(0)); }
async function decryptScene(blob, keyText) {
  const key = await crypto.subtle.importKey("raw", b64urlToBytes(keyText), "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function dateLabel(d) { if (!DATE_RE.test(d)) return ""; const [y, m, dd] = d.slice(0, 10).split("-").map(Number); return `${dd} ${MONTHS[m - 1]}${y !== new Date().getFullYear() ? " " + y : ""}`; }
const store = { get(k, d) { try { return localStorage.getItem("boards:" + k) || d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem("boards:" + k, v); } catch (e) {} } };

let scene = null, av = store.get("av", "all"), kind = store.get("kind", "all");

function cleanScene(s) {
  const kinds = (Array.isArray(s.kinds) ? s.kinds : []).filter((k) => k && /^[a-z]{2,16}$/.test(String(k.id || ""))).map((k) => ({ id: k.id, label: txt(k.label, 24) })).slice(0, 6);
  const kindIds = new Set(kinds.map((k) => k.id));
  const boards = (Array.isArray(s.boards) ? s.boards : []).filter((b) => b && kindIds.has(b.kind)).map((b) => ({
    id: txt(b.id, 40), code: txt(b.code, 16), name: txt(b.name, 48) || "Producto", what: txt(b.what, 110),
    avatar: b.avatar === "bella" ? "bella" : (b.avatar === "miamix" ? "miamix" : "otro"), kind: b.kind,
    status: txt(b.status, 24), tone: TONES.has(b.tone) ? b.tone : "muted", date: DATE_RE.test(String(b.date || "")) ? String(b.date) : "",
    thumb: THUMB_RE.test(String(b.thumb || "")) && String(b.thumb).length < 60000 ? b.thumb : "",
    board: boardUrl(b.board), missing: txt(b.missing, 120), note: txt(b.note, 200), noteTone: b.noteTone === "bad" ? "bad" : "soft" }));
  boards.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  return { updatedAt: s.updatedAt, kinds, boards, footer: (Array.isArray(s.footer) ? s.footer : []).map((t) => txt(t, 220)).slice(0, 6) };
}
const avLabel = (a) => (a === "bella" ? "Bella" : a === "miamix" ? "Miami X" : "Otro");
function cardHtml(b) {
  const kl = (scene.kinds.find((k) => k.id === b.kind) || {}).label || "";
  const img = b.thumb ? `<img alt="" src="${esc(b.thumb)}">` : `<span class="ph"></span>`;
  const note = b.note ? `<div class="note${b.noteTone === "bad" ? "" : " soft"}">${b.noteTone === "bad" ? "<b>⚠︎ </b>" : ""}${esc(b.note)}</div>` : "";
  const act = b.board ? `<a class="btn" href="${esc(b.board)}" target="_blank" rel="noopener noreferrer">Abrir board</a>`
    : `<span class="nolink">${esc(b.missing || "Sin link: Grok no tiene la llave de este board")}</span>`;
  return `<div class="card" data-b="${esc(b.id)}">${img}<div class="body"><div class="nm">${esc(b.name)}</div>${b.what ? `<div class="what">${esc(b.what)}</div>` : ""}`
    + `<div class="tags"><span class="tag st ${esc(b.tone)}">${esc(b.status)}</span><span class="tag">${esc(avLabel(b.avatar))}</span><span class="tag">${esc(kl)}</span>`
    + `<span class="when">${esc([b.code, dateLabel(b.date)].filter(Boolean).join(" · "))}</span></div>${note}<div class="act">${act}</div></div></div>`;
}
function render() {
  if (!scene) return;
  if (!AVATARS.some(([id]) => id === av)) av = "all";
  if (kind !== "all" && !scene.kinds.some((k) => k.id === kind)) kind = "all";
  const byAv = scene.boards.filter((b) => av === "all" || b.avatar === av);
  $("seg").innerHTML = AVATARS.map(([id, label]) => {
    const n = scene.boards.filter((b) => id === "all" || b.avatar === id).length;
    return `<button type="button" data-av="${id}" aria-pressed="${id === av}">${esc(label)}<i>${n}</i></button>`;
  }).join("");
  $("chips").innerHTML = [["all", "Todos los tipos"], ...scene.kinds.map((k) => [k.id, k.label])].map(([id, label]) => {
    const n = byAv.filter((b) => id === "all" || b.kind === id).length;
    return `<button type="button" data-kind="${esc(id)}" aria-pressed="${id === kind}">${esc(label)}<i>${n}</i></button>`;
  }).join("");
  const list = byAv.filter((b) => kind === "all" || b.kind === kind);
  const when = scene.updatedAt ? new Date(scene.updatedAt) : null;
  $("meta").textContent = `${scene.boards.length} boards` + (when && !Number.isNaN(when.getTime()) ? " · act. " + when.toLocaleTimeString("es", { hour: "numeric", minute: "2-digit" }) : "");
  $("main").innerHTML = (list.length ? `<div class="list">${list.map(cardHtml).join("")}</div>` : `<div class="empty">No hay boards con este filtro.</div>`)
    + (scene.footer.length ? `<div class="foot">${scene.footer.map((t) => `<p>${esc(t)}</p>`).join("")}</div>` : "");
  document.querySelectorAll("[data-av]").forEach((b) => b.addEventListener("click", () => { av = b.dataset.av; store.set("av", av); render(); window.scrollTo(0, 0); }));
  document.querySelectorAll("[data-kind]").forEach((b) => b.addEventListener("click", () => { kind = b.dataset.kind; store.set("kind", kind); render(); window.scrollTo(0, 0); }));
}
async function load() {
  const sec = secret();
  if (!sec.b || !sec.k) { $("main").innerHTML = `<p class="status">Este enlace está incompleto. Pídele a Grok el enlace completo.</p>`; return; }
  const okHost = location.hostname.endsWith("github.io") || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if (!okHost) { $("main").innerHTML = `<p class="status">Abre este enlace desde jorgedearmas.github.io.</p>`; return; }
  try {
    const res = await fetch(`scenes/${sec.b.replace(/[^a-zA-Z0-9_-]/g, "")}.json?t=${Date.now()}`, { cache: "no-store", referrerPolicy: "no-referrer" });
    if (!res.ok) throw new Error(String(res.status));
    const next = await decryptScene(await res.json(), sec.k);
    if (!next || next.type !== "boards") throw new Error("type");
    scene = cleanScene(next); render();
  } catch (e) {
    if (!scene) $("main").innerHTML = `<p class="status">No se pudo abrir. La llave no coincide o todavía se está publicando.</p>`;
  }
}
load();
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
