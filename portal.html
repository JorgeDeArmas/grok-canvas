<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob: https://cdn.jsdelivr.net; media-src 'self' blob: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net https://*.workers.dev https://*.r2.cloudflarestorage.com; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">
<meta name="theme-color" content="#f2f2f7">
<title>Portal</title>
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --text: #1c1c1e; --muted: #6e6e73; --line: rgba(60,60,67,.14);
    --accent: #007aff; --chip: #e9e9ee; --bad: #ff3b30; --good: #34c759; --warn: #ff9500; --info: #007aff; --teal: #30b0c7;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --line: rgba(255,255,255,.10); --accent: #0a84ff; --chip: #2c2c2e; }
    .say { background: color-mix(in srgb, var(--accent) 24%, var(--card)); } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%; }
  header { position: sticky; top: 0; z-index: 3; padding: calc(10px + var(--safe-t)) 16px 10px; background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px); border-bottom: 1px solid var(--line); }
  .top, main { max-width: 760px; margin: 0 auto; }
  .hrow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; }
  .meta { font-size: 12.5px; color: var(--muted); }
  button.back { border: 0; background: transparent; color: var(--accent); font: 600 16px -apple-system, sans-serif; min-height: 44px; padding: 0 4px 0 0; cursor: pointer; }
  main { padding: 12px 12px calc(28px + var(--safe-b)); }
  .list { background: var(--card); border-radius: 16px; overflow: hidden; }
  .card { display: flex; gap: 12px; padding: 12px; border-top: 1px solid var(--line); align-items: flex-start; }
  .card:first-child { border-top: 0; }
  .card img, .card .ph { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--chip); flex: none; }
  .body { flex: 1; min-width: 0; }
  .nm { font-size: 16.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  .tag { font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--text); }
  .st { color: #fff; }
  .st.bad { background: var(--bad); } .st.good { background: var(--good); } .st.info { background: var(--info); }
  .st.teal { background: var(--teal); } .st.warn { background: var(--warn); } .st.muted { background: var(--muted); }
  .act { margin-top: 9px; }
  button.btn, a.btn, label.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 11px; background: var(--accent); color: #fff; text-decoration: none;
    font: 600 15px/1.2 -apple-system, "Segoe UI", sans-serif; white-space: nowrap; border: 0; cursor: pointer; }
  button.ghost, .btn.ghost { background: var(--chip); color: var(--text); }
  [hidden] { display: none !important; }
  .empty, .status { background: var(--card); border-radius: 16px; padding: 22px 16px; text-align: center; color: var(--muted); }
  article { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  article h2 { font-size: 15px; margin: 0 0 10px; }
  .scene { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .scene img, .scene .ph { width: 100%; aspect-ratio: 9/16; object-fit: cover; border-radius: 12px; background: var(--chip); }
  .cap { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .beat { margin-top: 14px; }
  .beat:first-child { margin-top: 0; }
  .say { margin: 10px 0 8px; padding: 14px; border-radius: 14px;
    background: color-mix(in srgb, var(--accent) 16%, var(--card));
    border: 1px solid color-mix(in srgb, var(--accent) 42%, var(--line)); }
  .say .k, .do .k { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
  .say .k { color: var(--accent); }
  .say .q { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3; letter-spacing: -.02em; color: var(--text); }
  .do { margin-top: 4px; }
  .do .k { color: var(--muted); margin-bottom: 4px; }
  .do .d { font-size: 13.5px; font-weight: 400; line-height: 1.4; color: var(--muted); }
  .hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  .script { width: 100%; min-height: 140px; resize: vertical; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font: 16px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 12px; }
  video { width: 100%; border-radius: 12px; background: #000; display: block; }
  .banner { background: color-mix(in srgb, var(--warn) 18%, var(--card)); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  .banner.bad { background: color-mix(in srgb, var(--bad) 16%, var(--card)); }
  .row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .chk { width: 22px; height: 22px; border-radius: 99px; border: 1.5px solid var(--line); flex: none; margin-top: 2px; text-align: center; line-height: 20px; font-size: 13px; }
  .chk.on { background: var(--good); border-color: var(--good); color: #fff; }
  .chk.redo { background: var(--warn); border-color: var(--warn); color: #fff; }
  .bar { height: 6px; background: var(--chip); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; }
  .act.stack { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .act.stack .btn { width: 100%; }
  input[type=file] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .filebtn { position: relative; overflow: hidden; width: 100%; }
  .filebtn svg { width: 18px; height: 18px; flex: none; }
  .toast { font-size: 13px; color: var(--muted); min-height: 18px; margin-top: 6px; }
</style>
</head>
<body>
<header><div class="top">
  <div class="hrow"><button type="button" class="back" id="back" hidden>‹</button><h1 id="title">Portal</h1><span class="meta" id="meta"></span></div>
</div></header>
<main id="main"><p class="status">Cargando…</p></main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const THUMB_RE = /^data:image\/jpeg;base64,[A-Za-z0-9+/]+={0,2}$/;
const TONES = { sent: "info", opened: "teal", uploading: "warn", uploaded: "info", approved: "good", redo: "warn", pulled: "good" };
const LABELS = { sent: "Enviado", opened: "Abierto", uploading: "Subiendo", uploaded: "Subido", approved: "Aprobado", redo: "Re-grabar", pulled: "Listo" };
const UP_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 4l4.5 4.5-1.4 1.4L13 7.8V16h-2V7.8L8.9 9.9 7.5 8.5 12 4zM5 18h14v2H5v-2z"/></svg>';
const DB_NAME = "portal-uploads";
const CONCURRENCY = 3;
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function txt(s, max) { return String(s ?? "").replace(/[\u0000-\u001F\u007F\u2028\u2029]/g, " ").replace(/\s+/g, " ").trim().slice(0, max || 120); }
function secret() { const h = new URLSearchParams((location.hash || "").replace(/^#/, "")); return { b: h.get("b") || "", k: h.get("k") || "", t: h.get("t") || "" }; }
function b64urlToBytes(t) { const p = "=".repeat((4 - (t.length % 4)) % 4); const bin = atob(t.replace(/-/g, "+").replace(/_/g, "/") + p); return Uint8Array.from(bin, (c) => c.charCodeAt(0)); }
function b64ToBytes(t) { const bin = atob(t); return Uint8Array.from(bin, (c) => c.charCodeAt(0)); }
async function decryptScene(blob, keyText) {
  const key = await crypto.subtle.importKey("raw", b64urlToBytes(keyText), "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function apiBaseOk(raw) {
  try {
    const u = new URL(String(raw || ""));
    if (u.protocol !== "https:" || u.username || u.password) return "";
    const h = u.hostname.toLowerCase();
    if (h.endsWith(".workers.dev") || h === "localhost" || h === "127.0.0.1") return u.origin;
  } catch (e) {}
  return "";
}
function thumb(v) { const s = String(v || ""); return THUMB_RE.test(s) && s.length < 60000 ? s : ""; }
const MEDIA_NAME_RE = /^media\/m[a-f0-9]{16}\.enc$/i;
const SAFE_MIME = new Set(["image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "video/webm", "video/quicktime"]);
const decryptedMedia = new Map();
function safeMediaUrl(raw) {
  const t = String(raw || "").trim();
  if (!t || t.length > 2048 || /[\u0000-\u001F\u007F\\\s]/.test(t)) return "";
  if (MEDIA_NAME_RE.test(t)) {
    try { return new URL(t, location.href).href; } catch (e) { return ""; }
  }
  let u;
  try { u = new URL(t, location.href); } catch (e) { return ""; }
  if (u.protocol !== "https:" || u.username || u.password || u.port) return "";
  const host = u.hostname.toLowerCase();
  if (host !== "cdn.jsdelivr.net" && u.origin !== location.origin) return "";
  if (!/\/media\/m[a-f0-9]{16}\.enc$/i.test(u.pathname)) return "";
  return u.href;
}
function safeMime(raw, fallback) {
  const mime = String(raw ?? "").trim().toLowerCase().split(";")[0].trim();
  if (SAFE_MIME.has(mime)) return mime;
  return fallback && SAFE_MIME.has(fallback) ? fallback : (fallback || "application/octet-stream");
}
function asMedia(v, kind) {
  if (v && typeof v === "object" && v.enc === true) {
    const src = safeMediaUrl(v.src);
    if (!src) return null;
    return { enc: true, src, mime: safeMime(v.mime, kind === "video" ? "video/mp4" : "image/jpeg") };
  }
  if (kind !== "video") { const t = thumb(v); return t || null; }
  return null;
}
function mediaImg(v) {
  const m = asMedia(v, "image");
  if (!m) return `<span class="ph"></span>`;
  if (typeof m === "string") return `<img alt="" src="${esc(m)}">`;
  return `<img alt="" class="ph" data-enc="${esc(m.src)}" data-mime="${esc(m.mime)}">`;
}
async function decryptMediaNow(url, mime) {
  const safe = safeMediaUrl(url);
  if (!safe) throw new Error("blocked");
  const keyText = secret().k;
  if (!keyText) throw new Error("decrypt");
  const res = await fetch(safe, { referrerPolicy: "no-referrer", credentials: "omit" });
  if (!res.ok) throw new Error("http");
  const buf = new Uint8Array(await res.arrayBuffer());
  if (buf.byteLength < 28) throw new Error("decrypt");
  const key = await crypto.subtle.importKey("raw", b64urlToBytes(keyText), "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.subarray(0, 12) }, key, buf.subarray(12));
  return URL.createObjectURL(new Blob([plain], { type: safeMime(mime, "application/octet-stream") }));
}
async function hydrateEnc(root) {
  await Promise.all([...root.querySelectorAll("[data-enc]")].map(async (el) => {
    const src = el.getAttribute("data-enc") || "", mime = el.getAttribute("data-mime") || "", cacheKey = src + "\0" + mime;
    try {
      let url = decryptedMedia.get(cacheKey);
      if (!url) { url = await decryptMediaNow(src, mime); decryptedMedia.set(cacheKey, url); }
      el.src = url; el.classList.remove("ph");
    } catch (e) {}
  }));
}
let scene = null, live = null, view = "plp", productId = "", lock = null;

function openDb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("uploads");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(key) {
  const db = await openDb();
  return new Promise((res, rej) => {
    const q = db.transaction("uploads").objectStore("uploads").get(key);
    q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error);
  });
}
async function idbSet(key, val) {
  const db = await openDb();
  return new Promise((res, rej) => {
    const q = db.transaction("uploads", "readwrite").objectStore("uploads").put(val, key);
    q.onsuccess = () => res(); q.onerror = () => rej(q.error);
  });
}
async function idbDel(key) {
  const db = await openDb();
  return new Promise((res, rej) => {
    const q = db.transaction("uploads", "readwrite").objectStore("uploads").delete(key);
    q.onsuccess = () => res(); q.onerror = () => rej(q.error);
  });
}

function takeState(job, shot, take) {
  const t = ((live && live.takes) || []).find((x) => x.job_id === job && Number(x.shot) === Number(shot) && Number(x.take) === Number(take));
  return t || null;
}
function jobStatus(job) {
  const j = ((live && live.jobs) || []).find((x) => x.job_id === job);
  return (j && j.status) || (scene.products.find((p) => p.id === job) || {}).status || "sent";
}
function takeDisplay(ts) {
  if (ts && ts.pulled_at && ts.status !== "redo") return "pulled";
  return (ts && ts.status) || "sent";
}

async function api(path, opts) {
  const base = apiBaseOk(scene && scene.apiBase);
  if (!base) throw new Error("api");
  const sec = secret();
  const headers = Object.assign({ "content-type": "application/json" }, (opts && opts.headers) || {});
  if (sec.t) headers.authorization = "Bearer " + sec.t;
  const res = await fetch(base + path, Object.assign({ referrerPolicy: "no-referrer", credentials: "omit" }, opts || {}, { headers }));
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch (e) { body = { error: text }; }
  if (!res.ok) {
    const err = new Error((body && (body.message || body.error)) || String(res.status));
    err.status = res.status; err.body = body; throw err;
  }
  return body;
}

async function refreshLive() {
  const sec = secret();
  if (!sec.t || !apiBaseOk(scene && scene.apiBase)) return;
  try { live = await api("/s/" + encodeURIComponent(sec.t)); }
  catch (e) {
    if (e.status === 403) {
      $("title").textContent = "Portal";
      $("main").innerHTML = `<p class="status" id="inactive">Este enlace ya no está activo</p>`;
      scene = null;
      throw e;
    }
  }
}

async function renderPlp() {
  view = "plp"; productId = "";
  $("back").hidden = true;
  const name = txt(scene.creatorName, 40) || "creadora";
  $("title").textContent = "Hola, " + name;
  $("meta").textContent = (scene.products || []).length + " productos";
  const rows = (scene.products || []).map((p) => {
    const st = jobStatus(p.id);
    const img = mediaImg(p.thumb);
    return `<div class="card" data-p="${esc(p.id)}">${img}<div class="body"><div class="nm">${esc(txt(p.name, 48) || "Producto")}</div>`
      + `<div class="tags"><span class="tag st ${esc(TONES[st] || "muted")}">${esc(LABELS[st] || st)}</span></div>`
      + `<div class="act"><button type="button" class="btn" data-open="${esc(p.id)}">Ver board</button></div></div></div>`;
  }).join("");
  $("main").innerHTML = rows ? `<div class="list">${rows}</div>` : `<div class="empty">Nada que grabar.</div>`;
  $("main").querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => openPdp(b.dataset.open)));
  await hydrateEnc($("main"));
}

function sceneHtml(b) {
  const vo = b.vo ? `<div class="say"><div class="k">Lo que dices</div><blockquote class="q">${esc(txt(b.vo, 280))}</blockquote></div>` : "";
  const action = b.do_es ? `<div class="do"><div class="k">Qué haces</div><div class="d">${esc(txt(b.do_es, 400))}</div></div>` : "";
  return `<div class="beat" data-shot="${esc(b.shot)}"><div class="scene"><div>${mediaImg(b.refFrame)}<div class="cap">Referencia</div></div><div>${mediaImg(b.ourFrame)}<div class="cap">La nuestra</div></div></div>`
    + vo + action + `</div>`;
}

function takeLabel(st, pct) {
  if (st === "uploading") return pct == null ? "Subiendo" : `Subiendo ${Math.round(pct * 100)}%`;
  if (st === "uploaded" || st === "approved" || st === "pulled") return "Subido ✓";
  if (st === "redo") return "Rehacer";
  return "Enviado";
}
function uploadRow(p, shot, take) {
  const ts = takeState(p.id, shot, take);
  const st = takeDisplay(ts);
  const reason = (ts && ts.redo_reason) ? `<div class="banner">${esc(txt(ts.redo_reason, 200))}</div>` : "";
  const done = st === "uploaded" || st === "approved" || st === "pulled";
  const cls = st === "redo" ? "redo" : (done ? "on" : "");
  const mark = done ? "✓" : (st === "redo" ? "!" : "");
  const closed = st === "approved" || st === "pulled";
  const fileBtn = closed || (done && st !== "redo") ? "" : `<label class="filebtn btn">${UP_ICON} Subir video<input type="file" accept="video/*" data-file="${esc(p.id)}:${shot}:${take}"></label>`;
  const resumeBtn = closed ? "" : `<button type="button" class="btn ghost" data-resume="${esc(p.id)}:${shot}:${take}" hidden>Reanudar</button>`;
  return `<div class="row" data-up="${esc(p.id)}:${shot}:${take}">
    <div class="chk ${cls}">${mark}</div>
    <div class="body"><div class="nm">Escena ${String(shot).padStart(2, "0")} · take ${take}</div>
    <div class="meta">${esc(takeLabel(st))}</div>${reason}
    <div class="bar" hidden><i></i></div>
    <div class="act stack">${fileBtn}${resumeBtn}</div>
    <p class="toast" data-toast></p></div></div>`;
}

async function renderPdp(p) {
  view = "pdp"; productId = p.id;
  $("back").hidden = false;
  $("title").textContent = txt(p.name, 48) || "Board";
  $("meta").textContent = LABELS[jobStatus(p.id)] || "";
  const scenes = (p.beats || []).map(sceneHtml).join("");
  const shots = p.shots || (p.beats || []).map((b) => ({ shot: b.shot, takes: 1 }));
  const canUp = !!secret().t;
  const ups = canUp ? shots.flatMap((s) => {
    const n = Math.max(1, Number(s.takes || s.takesPerShot || 1));
    return Array.from({ length: n }, (_, i) => uploadRow(p, s.shot, i + 1));
  }).join("") : "";
  const refM = asMedia(p.refSrc, "video");
  const ref = refM && typeof refM === "object"
    ? `<video controls playsinline data-enc="${esc(refM.src)}" data-mime="${esc(refM.mime)}"></video>`
    : `<p class="meta">Sin video de referencia en este enlace.</p>`;
  const upBlock = canUp
    ? `<article id="sec-up"><h2>Subida</h2><p class="hint">Graba en 1080p</p>${ups}</article>`
    : `<article id="sec-up" hidden></article>`;
  $("main").innerHTML = `<div class="banner" id="stay" hidden>No cierres Safari mientras sube. Si se corta, vuelve a abrir este link y toca Reanudar.</div>
    <article id="sec-ref"><h2>Video de referencia</h2>${ref}</article>
    <article id="sec-board"><h2>Escenas</h2>${scenes || "<p class='meta'>Sin escenas.</p>"}</article>
    <article id="sec-script"><h2>Guion</h2><textarea class="script" id="script" readonly>${esc(p.script || "")}</textarea>
      <div class="act"><button type="button" class="btn" id="copy-script">Copiar guion</button></div><p class="toast" id="script-toast"></p></article>
    ${upBlock}`;
  $("copy-script").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("script").value); $("script-toast").textContent = "Copiado"; }
    catch (e) { $("script-toast").textContent = "No se pudo copiar"; }
  });
  $("main").querySelectorAll("[data-file]").forEach((inp) => inp.addEventListener("change", () => { if (inp.files && inp.files[0]) startUpload(inp.dataset.file, inp.files[0]); }));
  $("main").querySelectorAll("[data-resume]").forEach((b) => b.addEventListener("click", () => resumeUpload(b.dataset.resume)));
  await markResumable(p);
  await hydrateEnc($("main"));
}

async function loadProduct(id) {
  const p = (scene.products || []).find((x) => x.id === id);
  if (!p) return null;
  if (p.beats) return p;
  if (!p.blob) return p;
  const res = await fetch(`scenes/${String(p.blob).replace(/[^a-zA-Z0-9_-]/g, "")}.json?t=${Date.now()}`, { cache: "no-store", referrerPolicy: "no-referrer" });
  if (!res.ok) throw new Error("blob");
  const sub = await decryptScene(await res.json(), secret().k);
  return Object.assign({}, p, sub, { id: p.id, name: p.name || sub.name });
}

async function openPdp(id) {
  try {
    const p = await loadProduct(id);
    if (!p) return;
    await renderPdp(p);
  } catch (e) { $("main").innerHTML = `<p class="status">No se pudo abrir el board.</p>`; }
}

async function markResumable(p) {
  const shots = p.shots || (p.beats || []).map((b) => ({ shot: b.shot, takes: 1 }));
  for (const s of shots) {
    const n = Math.max(1, Number(s.takes || s.takesPerShot || 1));
    for (let t = 1; t <= n; t++) {
      const key = `${p.id}:${s.shot}:${t}`;
      const rec = await idbGet(key);
      const btn = $("main").querySelector(`[data-resume="${key}"]`);
      if (rec && rec.uploadId && !rec.done && btn) btn.hidden = false;
    }
  }
}

async function wake(on) {
  try {
    if (on) { if (!lock && navigator.wakeLock) lock = await navigator.wakeLock.request("screen"); }
    else { if (lock) { await lock.release(); lock = null; } }
  } catch (e) {}
}

function setProgress(key, pct, toast) {
  const row = $("main").querySelector(`[data-up="${key}"]`);
  if (!row) return;
  const bar = row.querySelector(".bar"); const i = row.querySelector(".bar i");
  bar.hidden = pct <= 0 || pct >= 1;
  i.style.width = Math.round(pct * 100) + "%";
  const meta = row.querySelector(".meta");
  if (pct > 0 && pct < 1) meta.textContent = takeLabel("uploading", pct);
  else if (pct >= 1) meta.textContent = takeLabel("uploaded");
  if (toast != null) row.querySelector("[data-toast]").textContent = toast;
}

function partAuthHeaders(url) {
  const headers = {};
  try {
    const u = new URL(url, location.href);
    const h = u.hostname.toLowerCase();
    if (h.endsWith(".workers.dev") || h === "localhost" || h === "127.0.0.1") {
      const t = secret().t;
      if (t) headers.authorization = "Bearer " + t;
    }
  } catch (e) {}
  return headers;
}

async function putPart(url, blob) {
  let last;
  for (let i = 0; i < 4; i++) {
    try {
      const res = await fetch(url, { method: "PUT", body: blob, referrerPolicy: "no-referrer", credentials: "omit", headers: partAuthHeaders(url) });
      if (res.ok) return { etag: (res.headers.get("etag") || res.headers.get("ETag") || "ok").replace(/"/g, ""), sha: await shaHex(blob) };
      last = new Error("http " + res.status);
    } catch (e) { last = e; }
    await new Promise((r) => setTimeout(r, 400 * Math.pow(2, i)));
  }
  throw last;
}

async function shaHex(blob) {
  const buf = await blob.arrayBuffer();
  const d = await crypto.subtle.digest("SHA-256", buf);
  return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

async function startUpload(key, file) {
  const [job, shot, take] = key.split(":");
  if (!file || !String(file.type || "").startsWith("video/")) { setProgress(key, 0, "Solo video"); return; }
  $("stay").hidden = false;
  await wake(true);
  try {
    const init = await api("/upload/init", { method: "POST", body: JSON.stringify({ job, shot: Number(shot), take: Number(take), size: file.size, mime: file.type || "video/mp4" }) });
    const rec = { uploadId: init.uploadId, key: init.key, partSize: init.partSize, size: file.size, mime: file.type, parts: {}, done: false };
    await idbSet(key, rec);
    await runUpload(key, file, rec);
  } catch (e) {
    setProgress(key, 0, e.status === 403 ? "Este enlace ya no está activo" : (e.status === 409 ? "Este take ya está cerrado" : "No se pudo empezar"));
  } finally { await wake(false); }
}

async function resumeUpload(key) {
  const rec = await idbGet(key);
  if (!rec || !rec.uploadId) { setProgress(key, 0, "Nada que reanudar"); return; }
  setProgress(key, Object.keys(rec.parts || {}).length / Math.max(1, Math.ceil(rec.size / rec.partSize)), "Reanudando…");
  $("stay").hidden = false;
  await wake(true);
  try {
    const input = $("main").querySelector(`[data-file="${key}"]`);
    const file = input && input.files && input.files[0];
    if (!file) { setProgress(key, 0, "Vuelve a elegir el video para reanudar"); return; }
    rec.size = file.size; rec.mime = file.type;
    await runUpload(key, file, rec);
  } finally { await wake(false); }
}

async function runUpload(key, file, rec) {
  const partSize = rec.partSize || (8 * 1024 * 1024);
  const total = Math.max(1, Math.ceil(file.size / partSize));
  const pending = [];
  for (let n = 1; n <= total; n++) if (!rec.parts[n]) pending.push(n);
  let doneN = total - pending.length;
  setProgress(key, doneN / total);
  async function worker() {
    while (pending.length) {
      const n = pending.shift();
      const start = (n - 1) * partSize;
      const blob = file.slice(start, Math.min(start + partSize, file.size));
      const signed = await api("/upload/sign", { method: "POST", body: JSON.stringify({ uploadId: rec.uploadId, partNumbers: [n] }) });
      const url = (signed.urls && signed.urls[0] && signed.urls[0].url) || "";
      const put = await putPart(url, blob);
      rec.parts[n] = { etag: put.etag, sha: put.sha };
      await idbSet(key, rec);
      doneN += 1;
      setProgress(key, doneN / total);
    }
  }
  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, pending.length || 1) }, () => worker()));
  const etags = Object.keys(rec.parts).map(Number).sort((a, b) => a - b).map((n) => ({ partNumber: n, etag: rec.parts[n].etag, sha256: rec.parts[n].sha }));
  await api("/upload/complete", { method: "POST", body: JSON.stringify({ uploadId: rec.uploadId, etags, size: file.size }) });
  rec.done = true; await idbSet(key, rec); await idbDel(key);
  setProgress(key, 1, "Subido");
  await refreshLive();
  if (view === "pdp") { const p = await loadProduct(productId); if (p) await renderPdp(p); }
}

$("back").addEventListener("click", () => { renderPlp(); });

async function load() {
  const sec = secret();
  if (!sec.b || !sec.k) { $("main").innerHTML = `<p class="status">Este enlace está incompleto. Pídele a Grok el enlace completo.</p>`; return; }
  const okHost = location.hostname.endsWith("github.io") || location.hostname === "localhost" || location.hostname === "127.0.0.1";
  if (!okHost) { $("main").innerHTML = `<p class="status">Abre este enlace desde GitHub Pages.</p>`; return; }
  try {
    const res = await fetch(`scenes/${sec.b.replace(/[^a-zA-Z0-9_-]/g, "")}.json?t=${Date.now()}`, { cache: "no-store", referrerPolicy: "no-referrer" });
    if (!res.ok) throw new Error("http");
    const next = await decryptScene(await res.json(), sec.k);
    if (!next || (next.type !== "portal" && next.type !== "board")) throw new Error("type");
    const productsIn = next.type === "board" ? [next] : (Array.isArray(next.products) ? next.products : []);
    scene = {
      type: "portal", creatorName: txt(next.creatorName, 40), apiBase: apiBaseOk(next.apiBase),
      products: productsIn.slice(0, 40).map((p) => ({
        id: txt(p.id, 16), name: txt(p.name, 48), thumb: asMedia(p.thumb, "image"), blob: txt(p.blob, 40),
        status: txt(p.status, 16) || "sent", script: String(p.script || "").slice(0, 20000),
        beats: Array.isArray(p.beats) ? p.beats.slice(0, 40).map((b) => ({
          shot: Number(b.shot) || 0, vo: txt(b.vo, 400), do_es: txt(b.do_es, 500),
          refFrame: asMedia(b.refFrame, "image"), ourFrame: asMedia(b.ourFrame, "image")
        })) : null,
        shots: Array.isArray(p.shots) ? p.shots.slice(0, 40).map((s) => ({ shot: Number(s.shot) || 0, takes: Number(s.takes || s.takesPerShot || 1) })) : null,
        refSrc: asMedia(p.refSrc, "video")
      }))
    };
    try { await refreshLive(); } catch (e) { if (!scene) return; }
    if (next.type === "board" && scene.products[0]) await openPdp(scene.products[0].id);
    else if (view === "pdp" && productId) openPdp(productId); else await renderPlp();
  } catch (e) {
    if (!scene) $("main").innerHTML = `<p class="status">No se pudo abrir. La llave no coincide o todavía se está publicando.</p>`;
  }
}
load();
document.addEventListener("visibilitychange", () => { if (!document.hidden && scene) refreshLive().then(() => { if (view === "plp") renderPlp(); }).catch(() => {}); });
</script>
